<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Plei Ambassador Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#07271F;
  --surface:#0D3D2B;
  --surface-2:#134B36;
  --surface-3:#0A3226;
  --border:#1E5A42;
  --accent:#00E676;
  --accent-2:#49DE7F;
  --text:#F4FBF7;
  --text-muted:#9FD9C4;
  --text-faint:#5D9C82;
  --warn:#FF8F72;
  --badge-ba-bg:#134B36; --badge-ba-fg:#49DE7F;
  --badge-cap-bg:#3A2F0D; --badge-cap-fg:#F4CA5A;
  --badge-sup-bg:#3A1030; --badge-sup-fg:#F17FC6;
  --badge-pm-bg:#0D2C3A;  --badge-pm-fg:#5EC8F1;
  --west:#3E8FD0; --central:#E0954C; --southeast:#9B72D6; --northeast:#D9BB4A;
  --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
#app{max-width:1240px;margin:0 auto;padding:28px 24px 80px;}
::selection{background:var(--accent);color:var(--bg);}
a{color:var(--accent-2);}
button{font-family:inherit;}
.tabular{font-variant-numeric:tabular-nums;}

/* ---- top bar ---- */
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:22px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--bg);font-size:15px;flex:none;}
.brand-name{font-weight:800;font-size:15px;letter-spacing:0.2px;}
.eyebrow{display:inline-block;background:var(--accent);color:var(--bg);font-weight:700;font-size:11.5px;padding:5px 13px;border-radius:999px;letter-spacing:0.5px;text-transform:uppercase;}
h1{font-size:28px;font-weight:800;margin:10px 0 2px;text-wrap:balance;}
.sub{color:var(--text-muted);font-size:14px;margin:0;}
.status-pill{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--border);color:var(--text-muted);white-space:nowrap;}
.status-pill.editing{border-color:var(--accent);color:var(--accent);}
.status-pill.readonly{border-color:var(--warn);color:var(--warn);}

/* ---- filter bar ---- */
.filterbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px;}
.filtergroup{display:flex;flex-wrap:wrap;gap:8px;}
.pill-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
.pill-btn:hover{border-color:var(--accent-2);color:var(--text);}
.pill-btn.active{background:var(--accent);border-color:var(--accent);color:var(--bg);}
.pill-btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}
.search-input{background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:13px;padding:8px 14px;border-radius:999px;min-width:180px;}
.search-input::placeholder{color:var(--text-faint);}
.search-input:focus{outline:2px solid var(--accent-2);outline-offset:1px;}

/* ---- generic card / surface ---- */
.card{background:var(--surface);border-radius:var(--radius-lg);}
.card-pad{padding:24px;}

/* ---- map section ---- */
.map-layout{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;margin-bottom:36px;}
@media (max-width:880px){.map-layout{grid-template-columns:1fr;}}
.map-svg-wrap{position:relative;}
.map-svg-wrap svg{display:block;width:100%;height:auto;}
.map-region{cursor:pointer;opacity:0.68;transition:opacity .15s;}
.map-region:hover,.map-region.active{opacity:0.95;}
.map-label{font-weight:800;font-size:19px;fill:var(--text);pointer-events:none;text-anchor:middle;}
.map-dot{fill:var(--accent);stroke:var(--bg);stroke-width:2;}
.stat-row{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;}
.stat-tile{flex:1;min-width:120px;background:var(--surface-2);border-radius:var(--radius-md);padding:14px 16px;}
.stat-num{font-size:22px;font-weight:800;}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:2px;}
.leaders-list{display:flex;flex-direction:column;}
.leader-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);gap:10px;}
.leader-row:last-child{border-bottom:none;}
.leader-name{font-weight:700;font-size:14px;}
.leader-sub{font-size:12px;color:var(--text-muted);margin-top:1px;}
.leader-region-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;}

/* ---- badges ---- */
.badge{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:0.2px;text-transform:uppercase;white-space:nowrap;}
.badge-ba{background:var(--badge-ba-bg);color:var(--badge-ba-fg);}
.badge-captain{background:var(--badge-cap-bg);color:var(--badge-cap-fg);}
.badge-supervisor{background:var(--badge-sup-bg);color:var(--badge-sup-fg);}
.badge-pm{background:var(--badge-pm-bg);color:var(--badge-pm-fg);}
.badge-outline{border:1px solid var(--border);color:var(--text-muted);background:transparent;}

/* ---- section heading ---- */
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:0 0 16px;flex-wrap:wrap;}
.section-head h2{font-size:19px;font-weight:800;margin:0;}
.section-head .count{color:var(--text-muted);font-size:13px;}
.btn{background:var(--accent);color:var(--bg);border:none;font-weight:700;font-size:13px;padding:10px 18px;border-radius:999px;cursor:pointer;}
.btn:hover{background:var(--accent-2);}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn.secondary:hover{border-color:var(--accent-2);color:var(--accent-2);}
.btn.danger{background:transparent;border:1px solid var(--warn);color:var(--warn);}
.btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;}
.icon-btn:hover{border-color:var(--accent-2);color:var(--accent-2);}

/* ---- roster grid ---- */
.roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:40px;}
.member-card{background:var(--surface);border-radius:var(--radius-lg);padding:18px;cursor:pointer;border:1px solid transparent;transition:border-color .15s;}
.member-card:hover{border-color:var(--border);}
.member-top{display:flex;gap:12px;align-items:center;}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-2);font-size:15px;flex:none;}
.member-name{font-weight:700;font-size:14.5px;}
.member-city{font-size:12px;color:var(--text-muted);}
.member-meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.member-events{font-size:12px;color:var(--text-muted);}
.empty-note{color:var(--text-faint);font-size:13px;padding:20px 4px;}

/* ---- detail panel / modal ---- */
.overlay{position:fixed;inset:0;background:rgba(3,15,11,0.66);display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;overflow-y:auto;z-index:40;}
.modal{background:var(--surface);border-radius:var(--radius-lg);max-width:640px;width:100%;padding:0;overflow:hidden;}
.modal-banner{height:70px;background:linear-gradient(120deg,var(--surface-2),var(--surface-3));}
.modal-body{padding:0 28px 28px;margin-top:-40px;}
.modal-avatar{width:82px;height:82px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:var(--bg);border:5px solid var(--surface);}
.modal-close{position:absolute;top:16px;right:16px;}
.field-row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.field-row:last-child{border-bottom:none;}
.field-row .k{color:var(--text-muted);}
.field-row .v{font-weight:600;text-align:right;}
.phase2-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px;}
.phase2-tile{background:var(--surface-2);border-radius:var(--radius-md);padding:12px 14px;opacity:0.55;}
.phase2-tile .num{font-size:18px;font-weight:800;}
.phase2-tile .lbl{font-size:11px;color:var(--text-muted);margin-top:2px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}

/* ---- forms ---- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
@media (max-width:520px){.form-grid{grid-template-columns:1fr;}}
.form-field{display:flex;flex-direction:column;gap:5px;grid-column:span 1;}
.form-field.full{grid-column:1 / -1;}
.form-field label{font-size:11.5px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.3px;}
.form-field input,.form-field select,.form-field textarea{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:9px 11px;border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;
}
.form-field textarea{resize:vertical;min-height:64px;}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:2px solid var(--accent-2);outline-offset:1px;}

/* ---- schedule + leaderboard ---- */
.bottom-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:20px;align-items:start;}
@media (max-width:880px){.bottom-layout{grid-template-columns:1fr;}}
.sched-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.sched-table th{text-align:left;color:var(--text-muted);font-weight:600;padding:6px 6px;font-size:11.5px;}
.sched-table td{padding:4px;}
.sched-name{font-weight:700;font-size:13px;white-space:nowrap;padding-right:10px;}
.sched-cell input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 7px;font-size:11.5px;font-family:inherit;}
.sched-cell input:focus{outline:2px solid var(--accent-2);}
.sched-wrap{overflow-x:auto;}
.leader-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.leader-item:last-child{border-bottom:none;}
.leader-item .rank{width:22px;display:inline-block;}
.leader-item.warn{color:var(--warn);}
.leader-item .n{font-weight:800;}
.readonly-banner{background:var(--surface-2);border:1px solid var(--warn);color:var(--warn);border-radius:var(--radius-md);padding:12px 16px;font-size:13px;margin-bottom:22px;}
.footer-note{color:var(--text-faint);font-size:12px;margin-top:36px;text-align:center;}
.saving-note{font-size:12px;color:var(--text-muted);margin-top:8px;}
.error-note{font-size:12px;color:var(--warn);margin-top:8px;}
</style>
</head>

eld-row .k{color:var(--text-muted);}\n.field-row .v{font-weight:600;text-align:right;}\n.phase2-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px;}\n.phase2-tile{background:var(--surface-2);border-radius:var(--radius-md);padding:12px 14px;opacity:0.55;}\n.phase2-tile .num{font-size:18px;font-weight:800;}\n.phase2-tile .lbl{font-size:11px;color:var(--text-muted);margin-top:2px;}\n.modal-actions{display:flex;gap:10px;margin-top:20px;}\n\n/* ---- forms ---- */\n.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}\n@media (max-width:520px){.form-grid{grid-template-columns:1fr;}}\n.form-field{display:flex;flex-direction:column;gap:5px;grid-column:span 1;}\n.form-field.full{grid-column:1 / -1;}\n.form-field label{font-size:11.5px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.3px;}\n.form-field input,.form-field select,.form-field textarea{\n  background:var(--surface-2);border:1px solid var(--border);color:var(--text);\n  padding:9px 11px;border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;\n}\n.form-field textarea{resize:vertical;min-height:64px;}\n.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:2px solid var(--accent-2);outline-offset:1px;}\n\n/* ---- schedule + leaderboard ---- */\n.bottom-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:20px;align-items:start;}\n@media (max-width:880px){.bottom-layout{grid-template-columns:1fr;}}\n.sched-table{width:100%;border-collapse:collapse;font-size:12.5px;}\n.sched-table th{text-align:left;color:var(--text-muted);font-weight:600;padding:6px 6px;font-size:11.5px;}\n.sched-table td{padding:4px;}\n.sched-name{font-weight:700;font-size:13px;white-space:nowrap;padding-right:10px;}\n.sched-cell input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 7px;font-size:11.5px;font-family:inherit;}\n.sched-cell input:focus{outline:2px solid var(--accent-2);}\n.sched-wrap{overflow-x:auto;}\n.leader-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;}\n.leader-item:last-child{border-bottom:none;}\n.leader-item .rank{width:22px;display:inline-block;}\n.leader-item.warn{color:var(--warn);}\n.leader-item .n{font-weight:800;}\n.readonly-banner{background:var(--surface-2);border:1px solid var(--warn);color:var(--warn);border-radius:var(--radius-md);padding:12px 16px;font-size:13px;margin-bottom:22px;}\n.footer-note{color:var(--text-faint);font-size:12px;margin-top:36px;text-align:center;}\n.saving-note{font-size:12px;color:var(--text-muted);margin-top:8px;}\n.error-note{font-size:12px;color:var(--warn);margin-top:8px;}\n";
  var HEAD_EXTRA = '<meta charset="utf-8">' +
    '<title>Plei Ambassador Portal</title>' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">' +
    '<style>' + CSS_TEXT + '</style>';

  var ROLE_LABELS = {ba:'Brand Ambassador', captain:'Captain', supervisor:'Regional Supervisor', pm:'Program Manager'};
  var ROLE_BADGE_CLASS = {ba:'badge-ba', captain:'badge-captain', supervisor:'badge-supervisor', pm:'badge-pm'};
  var REGION_ORDER = ['west','central','southeast','northeast'];
  var REGION_COLOR_VAR = {west:'--west', central:'--central', southeast:'--southeast', northeast:'--northeast'};
  var DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function initials(name){
    var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return '?';
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }
  function uid(prefix){
    return prefix + '-' + Math.random().toString(36).slice(2,9);
  }

  var stateEl = document.getElementById('initial-state');
  var STATE;
  try { STATE = JSON.parse(stateEl.textContent); } catch(e){ STATE = {regions:{},members:[],schedule:{weekLabel:'This week',days:DAYS,assignments:{}}}; }

  var FILTERS = {role:'all', region:'all', q:''};
  var UI = {selectedId:null, adding:false, editingId:null, editingRegions:false, saving:false, error:''};
  var READONLY = false;
  var CAPABILITY_MISSING = false;

  function buildFullPage(state){
    var json = JSON.stringify(state).replace(/</g, '\\u003c');
    return '<!doctype html><html><head>' + HEAD_EXTRA + '</head><body>' +
      '<div id="app"></div>' +
      '<script id="initial-state" type="application/json">' + json + '<' + '/script>' +
      '<script>' + OWN_SRC + '<' + '/script>' +
      '</body></html>';
  }

  var artifactCap = null;
  var capReady = (typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('artifact').then(function(c){ artifactCap = c; if(!c) CAPABILITY_MISSING = true; render(); return c; })
    : Promise.resolve(null).then(function(){ CAPABILITY_MISSING = true; render(); });

  function persist(nextState){
    if(CAPABILITY_MISSING || !artifactCap){ UI.error = 'Editing is unavailable in this view.'; render(); return; }
    UI.saving = true; UI.error=''; render();
    artifactCap.publish(buildFullPage(nextState)).then(function(){
      // successful publish reloads this view automatically
    }).catch(function(err){
      UI.saving = false;
      if(err && (err.code === 'not_writer' || err.code === 'not_granted' || err.code === 'consent_required')){
        READONLY = true;
        UI.error = '';
      } else if(err && err.code === 'conflict'){
        UI.error = '';
      } else {
        UI.error = 'Could not save — please try again.';
      }
      render();
    });
  }

  function updateState(mutator){
    var next = JSON.parse(JSON.stringify(STATE));
    mutator(next);
    STATE = next;
    persist(next);
  }

  function filteredMembers(){
    return STATE.members.filter(function(m){
      if(FILTERS.role !== 'all' && m.role !== FILTERS.role) return false;
      if(FILTERS.region !== 'all' && m.region !== FILTERS.region) return false;
      if(FILTERS.q){
        var q = FILTERS.q.toLowerCase();
        var hay = (m.name + ' ' + m.city).toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function cityCount(){
    var set = {};
    STATE.members.forEach(function(m){ if(m.city) set[m.city.trim().toLowerCase()] = 1; });
    return Object.keys(set).length;
  }

  function renderTopBar(){
    var statusHtml;
    if(READONLY){
      statusHtml = '<span class="status-pill readonly">View only</span>';
    } else if(CAPABILITY_MISSING){
      statusHtml = '<span class="status-pill">View only</span>';
    } else {
      statusHtml = '<span class="status-pill editing">' + (UI.saving ? 'Saving…' : 'Editing enabled') + '</span>';
    }
    return '' +
      '<div class="topbar">' +
        '<div>' +
          '<div class="brand"><div class="brand-mark">P</div><div class="brand-name">PLEI BRAND AMBASSADOR PROGRAM</div></div>' +
          '<h1>Ambassador Portal</h1>' +
          '<p class="sub">North America region map · roster · scheduling — replacing WhatsApp &amp; spreadsheets</p>' +
        '</div>' +
        statusHtml +
      '</div>';
  }

  function renderReadonlyBanner(){
    if(!READONLY) return '';
    return '<div class="readonly-banner">You\'re viewing a read-only copy of the Ambassador Portal. Ask Angel Montejo for edit access to make changes.</div>';
  }

  function renderFilterBar(){
    var roleBtns = ['all','ba','captain','supervisor','pm'].map(function(r){
      var label = r === 'all' ? 'All Roles' : ROLE_LABELS[r];
      return '<button class="pill-btn' + (FILTERS.role===r?' active':'') + '" data-action="filter-role" data-value="' + r + '">' + escapeHtml(label) + '</button>';
    }).join('');
    var regionBtns = ['all'].concat(REGION_ORDER).map(function(r){
      var label = r === 'all' ? 'All Regions' : STATE.regions[r].name;
      return '<button class="pill-btn' + (FILTERS.region===r?' active':'') + '" data-action="filter-region" data-value="' + r + '">' + escapeHtml(label) + '</button>';
    }).join('');
    return '' +
      '<div class="filterbar">' +
        '<div class="filtergroup">' + roleBtns + '</div>' +
        '<div class="filtergroup">' + regionBtns + '</div>' +
        '<input class="search-input" type="text" placeholder="Search name or city…" value="' + escapeHtml(FILTERS.q) + '" data-action="search">' +
      '</div>';
  }

  function regionMemberCount(key){
    return STATE.members.filter(function(m){ return m.region === key; }).length;
  }

  function renderMap(){
    var svgRegions = [
      {key:'west', cx:150, cy:230, rx:150, ry:220, lx:150, ly:236},
      {key:'central', cx:430, cy:230, rx:170, ry:230, lx:430, ly:226},
      {key:'southeast', cx:640, cy:270, rx:92, ry:200, lx:640, ly:338},
      {key:'northeast', cx:820, cy:180, rx:150, ry:170, lx:820, ly:136}
    ];
    var shapes = svgRegions.map(function(r){
      var activeClass = (FILTERS.region === r.key) ? ' active' : '';
      return '<ellipse class="map-region' + activeClass + '" data-action="pick-region" data-value="' + r.key + '" cx="' + r.cx + '" cy="' + r.cy + '" rx="' + r.rx + '" ry="' + r.ry + '" fill="var(' + REGION_COLOR_VAR[r.key] + ')"></ellipse>' +
        '<text class="map-label" x="' + r.lx + '" y="' + r.ly + '" data-action="pick-region" data-value="' + r.key + '">' + escapeHtml(STATE.regions[r.key].name.toUpperCase()) + '</text>' +
        '<circle class="map-dot" cx="' + r.cx + '" cy="' + (r.ly + 22) + '" r="7"></circle>';
    }).join('');

    var leaders = REGION_ORDER.map(function(key){
      var region = STATE.regions[key];
      return '<div class="leader-row">' +
        '<div><span class="leader-region-dot" style="background:var(' + REGION_COLOR_VAR[key] + ')"></span><span class="leader-name">' + escapeHtml(region.name) + '</span>' +
        '<div class="leader-sub" style="margin-left:16px">' + escapeHtml(region.supervisor || 'Unassigned') + ' · ' + regionMemberCount(key) + ' on team</div></div>' +
        (READONLY || CAPABILITY_MISSING ? '' : '<button class="icon-btn" data-action="edit-region" data-value="' + key + '" title="Edit region leader">✎</button>') +
      '</div>';
    }).join('');

    return '' +
      '<div class="map-layout">' +
        '<div class="card card-pad">' +
          '<div class="map-svg-wrap"><svg viewBox="0 0 1000 460" width="100%">' + shapes + '</svg></div>' +
          '<div class="stat-row">' +
            '<div class="stat-tile"><div class="stat-num tabular">' + STATE.members.length + '</div><div class="stat-label">Total team members</div></div>' +
            '<div class="stat-tile"><div class="stat-num tabular">' + cityCount() + '</div><div class="stat-label">Cities active</div></div>' +
            '<div class="stat-tile"><div class="stat-num tabular">4</div><div class="stat-label">Regions</div></div>' +
          '</div>' +
        '</div>' +
        '<div class="card card-pad">' +
          '<div class="section-head" style="margin-bottom:6px;"><h2 style="font-size:15px;">Region Leaders</h2></div>' +
          '<div class="leaders-list">' + leaders + '</div>' +
        '</div>' +
      '</div>';
  }

  function renderRoster(){
    var members = filteredMembers();
    var cards = members.map(function(m){
      var region = STATE.regions[m.region] || {name:m.region};
      return '<div class="member-card" data-action="open-member" data-value="' + m.id + '">' +
        '<div class="member-top">' +
          '<div class="avatar">' + escapeHtml(initials(m.name)) + '</div>' +
          '<div><div class="member-name">' + escapeHtml(m.name) + '</div><div class="member-city">' + escapeHtml(m.city || region.name) + '</div></div>' +
        '</div>' +
        '<div class="member-meta">' +
          '<span class="badge ' + ROLE_BADGE_CLASS[m.role] + '">' + escapeHtml(ROLE_LABELS[m.role]) + '</span>' +
          '<span class="member-events tabular">' + (m.eventsWorked||0) + ' events</span>' +
        '</div>' +
      '</div>';
    }).join('');
    var addBtn = (READONLY || CAPABILITY_MISSING) ? '' : '<button class="btn" data-action="add-member">+ Add member</button>';
    return '' +
      '<div id="roster-section">' +
        '<div class="section-head"><h2>Team Roster <span class="count">(' + members.length + ')</span></h2>' + addBtn + '</div>' +
        '<div class="roster-grid">' + (cards || '<div class="empty-note">No one matches these filters yet.</div>') + '</div>' +
      '</div>';
  }

  function renderSchedule(){
    var members = STATE.members;
    var rows = members.map(function(m){
      var cells = DAYS.map(function(d){
        var val = (STATE.schedule.assignments[m.id] && STATE.schedule.assignments[m.id][d]) || '';
        if(READONLY || CAPABILITY_MISSING){
          return '<td class="sched-cell">' + (val ? escapeHtml(val) : '') + '</td>';
        }
        return '<td class="sched-cell"><input type="text" data-action="sched-input" data-member="' + m.id + '" data-day="' + d + '" value="' + escapeHtml(val) + '" placeholder="—"></td>';
      }).join('');
      return '<tr><td class="sched-name">' + escapeHtml(m.name.split(' ')[0] + ' ' + (m.name.split(' ')[1]||'').slice(0,1)) + '.</td>' + cells + '</tr>';
    }).join('');
    var headCells = DAYS.map(function(d){ return '<th>' + d + '</th>'; }).join('');
    var saveBtn = (READONLY || CAPABILITY_MISSING) ? '' : '<button class="btn secondary" data-action="save-schedule" style="margin-top:14px;">Save schedule</button>';
    return '' +
      '<div class="card card-pad">' +
        '<div class="section-head" style="margin-bottom:10px;"><h2 style="font-size:16px;">' + escapeHtml(STATE.schedule.weekLabel) + ' — Who\'s Working Where</h2></div>' +
        '<div class="sched-wrap"><table class="sched-table"><thead><tr><th></th>' + headCells + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
        saveBtn +
      '</div>';
  }

  function renderLeaderboard(){
    var sorted = STATE.members.slice().sort(function(a,b){ return (b.eventsWorked||0) - (a.eventsWorked||0); });
    var medals = ['🥇','🥈','🥉'];
    var items = sorted.slice(0,8).map(function(m,i){
      var warn = (m.eventsWorked||0) === 0;
      return '<div class="leader-item' + (warn?' warn':'') + '">' +
        '<span><span class="rank">' + (medals[i] || (i+1)+'.') + '</span>' + escapeHtml(m.name) + (warn ? ' — needs outreach' : '') + '</span>' +
        '<span class="n tabular">' + (m.eventsWorked||0) + '</span>' +
      '</div>';
    }).join('');
    return '' +
      '<div class="card card-pad">' +
        '<div class="section-head" style="margin-bottom:4px;"><h2 style="font-size:16px;">Activity Leaderboard</h2></div>' +
        '<div class="sub" style="margin-bottom:10px;">Events worked, all-time count</div>' +
        (items || '<div class="empty-note">Add members to see the leaderboard.</div>') +
      '</div>';
  }

  function renderMemberModal(){
    if(!UI.selectedId) return '';
    var m = STATE.members.filter(function(x){ return x.id === UI.selectedId; })[0];
    if(!m) return '';
    var region = STATE.regions[m.region] || {name:m.region};
    var actions = (READONLY || CAPABILITY_MISSING) ? '' :
      '<div class="modal-actions">' +
        '<button class="btn secondary" data-action="edit-member" data-value="' + m.id + '">Edit</button>' +
        '<button class="btn danger" data-action="delete-member" data-value="' + m.id + '">Remove</button>' +
      '</div>';
    return '' +
      '<div class="overlay" data-action="close-modal">' +
        '<div class="modal" onclick="event.stopPropagation()">' +
          '<div class="modal-banner"></div>' +
          '<div class="modal-body">' +
            '<div class="modal-avatar">' + escapeHtml(initials(m.name)) + '</div>' +
            '<h2 style="margin:14px 0 2px;">' + escapeHtml(m.name) + '</h2>' +
            '<div class="sub" style="margin-bottom:8px;">' + escapeHtml(m.city ? m.city + ' · ' : '') + escapeHtml(region.name) + ' Region</div>' +
            '<span class="badge ' + ROLE_BADGE_CLASS[m.role] + '">' + escapeHtml(ROLE_LABELS[m.role]) + '</span>' +
            '<div style="margin-top:16px;">' +
              '<div class="field-row"><span class="k">Start date</span><span class="v">' + escapeHtml(m.startDate || '—') + '</span></div>' +
              '<div class="field-row"><span class="k">Profession</span><span class="v">' + escapeHtml(m.profession || '—') + '</span></div>' +
              '<div class="field-row"><span class="k">Events worked</span><span class="v tabular">' + (m.eventsWorked||0) + '</span></div>' +
              '<div class="field-row"><span class="k">Experience</span><span class="v" style="text-align:left;max-width:340px;">' + escapeHtml(m.experience || '—') + '</span></div>' +
            '</div>' +
            '<div class="eyebrow" style="margin-top:18px;">Coming in phase 2</div>' +
            '<div class="phase2-grid">' +
              '<div class="phase2-tile"><div class="num">—</div><div class="lbl">Games played</div></div>' +
              '<div class="phase2-tile"><div class="num">—</div><div class="lbl">Last active</div></div>' +
              '<div class="phase2-tile"><div class="num">—</div><div class="lbl">Social activity</div></div>' +
              '<div class="phase2-tile"><div class="num">—</div><div class="lbl">Affiliate referrals</div></div>' +
            '</div>' +
            actions +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function renderMemberForm(){
    if(!UI.adding && !UI.editingId) return '';
    var editing = UI.editingId ? STATE.members.filter(function(x){ return x.id === UI.editingId; })[0] : null;
    var m = editing || {name:'',region:'central',role:'ba',city:'',startDate:'',experience:'',profession:'',eventsWorked:0};
    var regionOpts = REGION_ORDER.map(function(r){ return '<option value="' + r + '"' + (m.region===r?' selected':'') + '>' + STATE.regions[r].name + '</option>'; }).join('');
    var roleOpts = ['ba','captain','supervisor','pm'].map(function(r){ return '<option value="' + r + '"' + (m.role===r?' selected':'') + '>' + ROLE_LABELS[r] + '</option>'; }).join('');
    return '' +
      '<div class="overlay" data-action="close-form">' +
        '<div class="modal" onclick="event.stopPropagation()">' +
          '<div class="modal-body" style="margin-top:28px;">' +
            '<h2 style="margin-top:0;">' + (editing ? 'Edit member' : 'Add member') + '</h2>' +
            '<div class="form-grid">' +
              '<div class="form-field full"><label>Name</label><input id="f-name" type="text" value="' + escapeHtml(m.name) + '"></div>' +
              '<div class="form-field"><label>Region</label><select id="f-region">' + regionOpts + '</select></div>' +
              '<div class="form-field"><label>Position</label><select id="f-role">' + roleOpts + '</select></div>' +
              '<div class="form-field"><label>City</label><input id="f-city" type="text" value="' + escapeHtml(m.city) + '"></div>' +
              '<div class="form-field"><label>Start date</label><input id="f-start" type="text" placeholder="e.g. Feb 2025" value="' + escapeHtml(m.startDate) + '"></div>' +
              '<div class="form-field"><label>Profession</label><input id="f-profession" type="text" value="' + escapeHtml(m.profession) + '"></div>' +
              '<div class="form-field"><label>Events worked</label><input id="f-events" type="number" min="0" value="' + (m.eventsWorked||0) + '"></div>' +
              '<div class="form-field full"><label>Experience with Plei</label><textarea id="f-experience">' + escapeHtml(m.experience) + '</textarea></div>' +
            '</div>' +
            '<div class="modal-actions">' +
              '<button class="btn" data-action="save-member" data-value="' + (editing ? editing.id : '') + '">Save</button>' +
              '<button class="btn secondary" data-action="close-form">Cancel</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function renderRegionForm(){
    if(!UI.editingRegions) return '';
    var rows = REGION_ORDER.map(function(key){
      return '<div class="form-field full"><label>' + STATE.regions[key].name + ' supervisor</label><input data-region-input="' + key + '" type="text" value="' + escapeHtml(STATE.regions[key].supervisor) + '"></div>';
    }).join('');
    return '' +
      '<div class="overlay" data-action="close-region-form">' +
        '<div class="modal" onclick="event.stopPropagation()">' +
          '<div class="modal-body" style="margin-top:28px;">' +
            '<h2 style="margin-top:0;">Edit region leadership</h2>' +
            '<div class="form-grid">' + rows + '</div>' +
            '<div class="modal-actions">' +
              '<button class="btn" data-action="save-regions">Save</button>' +
              '<button class="btn secondary" data-action="close-region-form">Cancel</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function render(){
    var html = '' +
      renderTopBar() +
      renderReadonlyBanner() +
      renderFilterBar() +
      renderMap() +
      renderRoster() +
      '<div class="bottom-layout">' + renderSchedule() + renderLeaderboard() + '</div>' +
      (UI.error ? '<div class="error-note">' + escapeHtml(UI.error) + '</div>' : '') +
      '<div class="footer-note">Plei Brand Ambassador Program · Phase 1 preview · Phase 2 adds games played, activity tracking, social &amp; affiliate data to every profile.</div>' +
      renderMemberModal() +
      renderMemberForm() +
      renderRegionForm();
    document.getElementById('app').innerHTML = html;
    bindHandlers();
  }

  function bindHandlers(){
    var app = document.getElementById('app');
    app.querySelectorAll('[data-action]').forEach(function(el){
      var action = el.getAttribute('data-action');
      if(action === 'filter-role'){
        el.addEventListener('click', function(){ FILTERS.role = el.getAttribute('data-value'); render(); });
      } else if(action === 'filter-region' || action === 'pick-region'){
        el.addEventListener('click', function(){ FILTERS.region = el.getAttribute('data-value'); render(); document.getElementById('roster-section').scrollIntoView({behavior:'smooth', block:'start'}); });
      } else if(action === 'search'){
        el.addEventListener('input', function(){ FILTERS.q = el.value; render(); var input = document.querySelector('.search-input'); if(input){ input.focus(); input.setSelectionRange(input.value.length, input.value.length);} });
      } else if(action === 'open-member'){
        el.addEventListener('click', function(){ UI.selectedId = el.getAttribute('data-value'); render(); });
      } else if(action === 'close-modal'){
        el.addEventListener('click', function(){ UI.selectedId = null; render(); });
      } else if(action === 'add-member'){
        el.addEventListener('click', function(){ UI.adding = true; UI.editingId = null; UI.selectedId = null; render(); });
      } else if(action === 'edit-member'){
        el.addEventListener('click', function(){ UI.editingId = el.getAttribute('data-value'); UI.adding = false; UI.selectedId = null; render(); });
      } else if(action === 'delete-member'){
        el.addEventListener('click', function(){
          var id = el.getAttribute('data-value');
          UI.selectedId = null;
          updateState(function(next){ next.members = next.members.filter(function(x){ return x.id !== id; }); });
        });
      } else if(action === 'close-form'){
        el.addEventListener('click', function(){ UI.adding = false; UI.editingId = null; render(); });
      } else if(action === 'save-member'){
        el.addEventListener('click', function(){
          var id = el.getAttribute('data-value');
          var data = {
            name: document.getElementById('f-name').value.trim() || 'Unnamed',
            region: document.getElementById('f-region').value,
            role: document.getElementById('f-role').value,
            city: document.getElementById('f-city').value.trim(),
            startDate: document.getElementById('f-start').value.trim(),
            profession: document.getElementById('f-profession').value.trim(),
            eventsWorked: parseInt(document.getElementById('f-events').value, 10) || 0,
            experience: document.getElementById('f-experience').value.trim()
          };
          UI.adding = false; UI.editingId = null;
          updateState(function(next){
            if(id){
              next.members = next.members.map(function(m){ return m.id === id ? Object.assign({}, m, data) : m; });
            } else {
              data.id = uid('m');
              next.members.push(data);
            }
          });
        });
      } else if(action === 'edit-region'){
        el.addEventListener('click', function(){ UI.editingRegions = true; render(); });
      } else if(action === 'close-region-form'){
        el.addEventListener('click', function(){ UI.editingRegions = false; render(); });
      } else if(action === 'save-regions'){
        el.addEventListener('click', function(){
          var inputs = document.querySelectorAll('[data-region-input]');
          var updates = {};
          inputs.forEach(function(inp){ updates[inp.getAttribute('data-region-input')] = inp.value.trim(); });
          UI.editingRegions = false;
          updateState(function(next){
            Object.keys(updates).forEach(function(k){ next.regions[k].supervisor = updates[k]; });
          });
        });
      } else if(action === 'save-schedule'){
        el.addEventListener('click', function(){
          var inputs = document.querySelectorAll('[data-action="sched-input"]');
          var assignments = JSON.parse(JSON.stringify(STATE.schedule.assignments));
          inputs.forEach(function(inp){
            var member = inp.getAttribute('data-member'), day = inp.getAttribute('data-day');
            assignments[member] = assignments[member] || {};
            assignments[member][day] = inp.value.trim();
          });
          updateState(function(next){ next.schedule.assignments = assignments; });
        });
      }
    });
  }

  render();
})();
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Plei Ambassador Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.js"></script>
<style>
:root{
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --surface-2:#F1F3F5;
  --surface-3:#EDEFF2;
  --border:#E4E7EB;
  --accent:#1F7A4D;
  --accent-2:#28965F;
  --accent-soft:#EAF7EF;
  --on-accent:#FFFFFF;
  --text:#15181C;
  --text-muted:#6B7280;
  --text-faint:#9AA1AB;
  --warn:#C0432A;
  --warn-soft:#FBEAE6;
  --badge-ba-bg:#EAF7EF; --badge-ba-fg:#1F7A4D;
  --badge-cap-bg:#FBF1D8; --badge-cap-fg:#8A6A1B;
  --badge-sup-bg:#F1EAFB; --badge-sup-fg:#6D3FC2;
  --badge-pm-bg:#E7F0FC;  --badge-pm-fg:#2058B0;
  --badge-host-bg:#F3F4F6; --badge-host-fg:#4B5563;
  --west:#5B8FC7; --central:#DB9A55; --southeast:#A47FCB; --northeast:#B99B3E;
  --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(16,24,32,0.05);
  --shadow-md:0 4px 14px rgba(16,24,32,0.07);
  --shadow-lg:0 12px 32px rgba(16,24,32,0.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
#app{max-width:1240px;margin:0 auto;padding:28px 24px 80px;}
::selection{background:var(--accent);color:var(--bg);}
a{color:var(--accent-2);}
button{font-family:inherit;}
.tabular{font-variant-numeric:tabular-nums;}

.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:22px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--on-accent);font-size:15px;flex:none;}
.brand-name{font-weight:800;font-size:15px;letter-spacing:0.2px;}
.eyebrow{display:inline-block;background:var(--accent);color:var(--bg);font-weight:700;font-size:11.5px;padding:5px 13px;border-radius:999px;letter-spacing:0.5px;text-transform:uppercase;}
h1{font-size:28px;font-weight:800;margin:10px 0 2px;text-wrap:balance;}
.sub{color:var(--text-muted);font-size:14px;margin:0;}
.topbar-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.status-pill{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--border);color:var(--text-muted);white-space:nowrap;}
.status-pill.editing{border-color:var(--accent);color:var(--accent);}
.status-pill.readonly{border-color:var(--warn);color:var(--warn);}
.auth-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;}
.auth-btn:hover{border-color:var(--accent-2);color:var(--accent-2);}
.auth-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.auth-btn.primary:hover{background:var(--accent-2);}

.filterbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px;}
.filtergroup{display:flex;flex-wrap:wrap;gap:8px;}
.pill-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
.pill-btn:hover{border-color:var(--accent-2);color:var(--text);}
.pill-btn.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.pill-btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}
.search-input{background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:13px;padding:8px 14px;border-radius:999px;min-width:180px;}
.search-input::placeholder{color:var(--text-faint);}
.search-input:focus{outline:2px solid var(--accent-2);outline-offset:1px;}

.card{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-sm);}
.card-pad{padding:24px;}

.map-svg-wrap{position:relative;margin-bottom:14px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border);}
.map-svg-wrap svg{display:block;width:100%;height:auto;}
.na-ocean{fill:#dcecf1;}
.na-landmass{fill:#c9e4d4;stroke:#5f8a71;stroke-width:1.6;}
.na-state-lines{fill:none;stroke:#5f8a71;stroke-width:1;stroke-opacity:0.85;pointer-events:none;}
.map-region{cursor:pointer;opacity:0.62;transition:opacity .15s;}
.map-region:hover,.map-region.active{opacity:0.82;}
.map-label{font-weight:800;font-size:18px;fill:#fff;pointer-events:none;text-anchor:middle;letter-spacing:0.5px;paint-order:stroke;stroke:rgba(0,0,0,0.3);stroke-width:3px;}
.pin{cursor:pointer;stroke:#fff;stroke-width:1.5;transition:r .12s;}
.city-group{cursor:pointer;}
.city-group:hover .pin{r:7;}
.pin-label{font-size:10.5px;font-weight:700;fill:var(--text);paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none;}
.city-group:hover .pin-label{fill:var(--accent);}
.map-fallback{padding:20px;color:var(--text-muted);font-size:13.5px;}
.map-fallback-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 4px 16px;}
@media (max-width:700px){.map-fallback-grid{grid-template-columns:repeat(2,1fr);}}
.map-fallback-col{font-size:13px;}
.map-fallback-head{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px;}
.map-fallback-city{cursor:pointer;padding:3px 0;color:var(--text-muted);}
.map-fallback-city:hover{color:var(--accent);}
.map-unmapped-note{font-size:11.5px;color:var(--text-muted);padding:0 4px 4px;}
.map-unmapped-city{cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
.map-unmapped-city:hover{color:var(--accent);}
.stat-row{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;}
.stat-tile{flex:1;min-width:120px;background:var(--surface-2);border-radius:var(--radius-md);padding:14px 16px;}
.stat-num{font-size:22px;font-weight:800;}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:2px;}
.region-table{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
@media (max-width:900px){.region-table{grid-template-columns:repeat(2,1fr);}}
@media (max-width:520px){.region-table{grid-template-columns:1fr;}}
.region-col{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border);background:var(--surface-2);transition:box-shadow .12s;}
.region-col.active{box-shadow:0 0 0 2px var(--accent) inset;}
.region-col-head{padding:8px 12px;font-weight:800;font-size:12px;color:#fff;text-transform:uppercase;letter-spacing:0.4px;}
.region-col-head[data-action]{cursor:pointer;}
.region-col-body{padding:12px;}
.region-col-name{font-weight:700;font-size:14px;}
.region-col-sub{font-size:11.5px;color:var(--text-muted);margin-top:3px;}

.badge{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:0.2px;text-transform:uppercase;white-space:nowrap;}
.badge-ba{background:var(--badge-ba-bg);color:var(--badge-ba-fg);}
.badge-captain{background:var(--badge-cap-bg);color:var(--badge-cap-fg);}
.badge-supervisor{background:var(--badge-sup-bg);color:var(--badge-sup-fg);}
.badge-pm{background:var(--badge-pm-bg);color:var(--badge-pm-fg);}
.badge-host{background:var(--badge-host-bg);color:var(--badge-host-fg);}
.badge-outline{border:1px solid var(--border);color:var(--text-muted);background:transparent;}
.badge-credit{background:#e4f5ea;color:#1f7a4d;}

.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:0 0 16px;flex-wrap:wrap;}
.section-head h2{font-size:19px;font-weight:800;margin:0;}
.section-head .count{color:var(--text-muted);font-size:13px;}
.btn{background:var(--accent);color:var(--on-accent);border:none;font-weight:700;font-size:13px;padding:10px 18px;border-radius:999px;cursor:pointer;}
.btn:hover{background:var(--accent-2);}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn.secondary:hover{border-color:var(--accent-2);color:var(--accent-2);}
.btn.danger{background:transparent;border:1px solid var(--warn);color:var(--warn);}
.btn:disabled{opacity:0.5;cursor:default;}
.btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;}
.icon-btn:hover{border-color:var(--accent-2);color:var(--accent-2);}

.roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:40px;}
.member-card{background:var(--surface);border-radius:var(--radius-lg);padding:18px;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s;}
.member-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md);}
.member-top{display:flex;gap:12px;align-items:center;}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent);font-size:15px;flex:none;}
.member-name{font-weight:700;font-size:14.5px;}
.member-city{font-size:12px;color:var(--text-muted);}
.member-meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.member-events{font-size:12px;color:var(--text-muted);}
.empty-note{color:var(--text-faint);font-size:13px;padding:20px 4px;}
.empty-actions{padding:4px;}

.overlay{position:fixed;inset:0;background:rgba(15,23,31,0.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;overflow-y:auto;z-index:40;}
.modal{background:var(--surface);border-radius:var(--radius-lg);max-width:640px;width:100%;padding:0;overflow:hidden;box-shadow:var(--shadow-lg);}
.modal-body{padding:28px;}
.modal-header{display:flex;align-items:flex-start;gap:16px;}
.modal-avatar{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:var(--accent);flex:none;}
.modal-heading{flex:1;min-width:0;}
.modal-heading h2{margin:0;font-size:20px;font-weight:800;}
.modal-heading .sub{margin-top:3px;}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 20px;}
.tag{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--border);color:var(--text-muted);background:var(--surface);}
.section-label{font-size:11.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;margin:22px 0 10px;}
.week-list{display:flex;flex-direction:column;gap:8px;}
.week-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 14px;gap:10px;}
.week-day{font-weight:700;font-size:13px;}
.week-value{font-size:13px;color:var(--text-muted);}
.week-status{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:uppercase;white-space:nowrap;}
.week-status.on{background:var(--accent-soft);color:var(--accent);}
.week-status.off{background:var(--surface-2);color:var(--text-faint);}
.about-text{font-size:13.5px;color:var(--text-muted);line-height:1.6;margin-top:2px;}
.modal-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
@media (max-width:520px){.form-grid{grid-template-columns:1fr;}}
.form-field{display:flex;flex-direction:column;gap:5px;grid-column:span 1;}
.form-field.full{grid-column:1 / -1;}
.form-field label{font-size:11.5px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.3px;}
.form-field input,.form-field select,.form-field textarea{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:9px 11px;border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;
}
.form-field textarea{resize:vertical;min-height:64px;}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:2px solid var(--accent-2);outline-offset:1px;}

.kv-row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.kv-row:last-child{border-bottom:none;}
.kv-row .k{color:var(--text-muted);white-space:nowrap;}
.kv-row .v{font-weight:600;text-align:right;max-width:62%;word-break:break-word;}
.badge-inactive{background:var(--warn-soft);color:var(--warn);}
.import-dropzone{border:2px dashed var(--border);border-radius:var(--radius-md);padding:26px;text-align:center;color:var(--text-muted);font-size:13px;}
.import-dropzone input{margin-top:10px;}
.import-summary{font-size:13px;color:var(--text-muted);margin:14px 0;white-space:pre-line;}
.checkbox-row{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-muted);cursor:pointer;}

.bottom-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:20px;align-items:start;}
@media (max-width:880px){.bottom-layout{grid-template-columns:1fr;}}
.sched-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.sched-table th{text-align:left;color:var(--text-muted);font-weight:600;padding:6px 6px;font-size:11.5px;}
.sched-table td{padding:4px;}
.sched-name{font-weight:700;font-size:13px;white-space:nowrap;padding-right:10px;}
.sched-cell input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 7px;font-size:11.5px;font-family:inherit;}
.sched-cell input:focus{outline:2px solid var(--accent-2);}
.sched-wrap{overflow-x:auto;}
.leader-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.leader-item:last-child{border-bottom:none;}
.leader-item .rank{width:22px;display:inline-block;}
.leader-item.warn{color:var(--warn);}
.leader-item .n{font-weight:800;}
.readonly-banner{background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);border-radius:var(--radius-md);padding:12px 16px;font-size:13px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
.readonly-banner.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);}
.internal-note{background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);border-radius:var(--radius-md);padding:16px;font-size:13px;}
.footer-note{color:var(--text-faint);font-size:12px;margin-top:36px;text-align:center;}
.saving-note{font-size:12px;color:var(--text-muted);margin-top:8px;}
.error-note{font-size:12px;color:var(--warn);margin-top:8px;}
.log-list{display:flex;flex-direction:column;max-height:60vh;overflow-y:auto;}
.log-row{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
.log-row:last-child{border-bottom:none;}
.log-meta{color:var(--text-muted);font-size:11.5px;margin-top:2px;}
.navbar{display:flex;gap:4px;margin-bottom:22px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.nav-link{padding:10px 14px;font-size:13.5px;font-weight:700;color:var(--text-muted);text-decoration:none;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px;}
.nav-link:hover{color:var(--text);}
.nav-link.active{color:var(--accent);border-bottom-color:var(--accent);}
.filter-trigger{position:relative;}
.filter-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:22px;box-shadow:var(--shadow-md);}
.filter-panel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;}
.filter-col-label{font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:8px;}
.filter-check{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text);padding:4px 0;cursor:pointer;}
.filter-panel-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);gap:10px;flex-wrap:wrap;}
.add-type-row{display:flex;gap:6px;margin-top:8px;}
.add-type-row input{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:8px;font-size:12.5px;}
.region-cities{font-size:11.5px;color:var(--text-faint);margin-top:3px;line-height:1.5;max-width:420px;}
.batype-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.batype-check{display:flex;align-items:center;gap:6px;font-size:12.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:6px 12px;cursor:pointer;}
.page-header{margin-bottom:20px;}
.page-header h1{font-size:24px;margin:0 0 4px;}
.apply-success{background:var(--accent-soft);color:var(--accent);border-radius:var(--radius-md);padding:16px;font-size:14px;}
.policy-card{border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;margin-bottom:14px;background:var(--surface);}
.policy-title{font-weight:800;font-size:15px;margin-bottom:6px;}
.policy-body{font-size:13.5px;color:var(--text-muted);white-space:pre-wrap;line-height:1.6;}
.policy-actions{display:flex;gap:8px;margin-top:12px;}
.application-row{border-bottom:1px solid var(--border);padding:12px 0;font-size:13px;}
.application-row:last-child{border-bottom:none;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.overlay{animation:fadeIn .12s ease;}
.modal{animation:modalIn .16s ease;}

.gate-wrap{position:fixed;inset:0;z-index:500;background:radial-gradient(circle at 30% 20%,#0D3D2B 0%,#07271F 55%,#04140F 100%);overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;}
.gate-cards-field{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.gate-card{position:absolute;display:flex;align-items:center;gap:10px;background:rgba(13,61,43,0.55);border:1px solid rgba(0,230,118,0.18);border-radius:14px;padding:10px 14px;backdrop-filter:blur(1px);animation-name:gateFloat;animation-timing-function:ease-in-out;animation-iteration-count:infinite;will-change:transform;}
.gate-card .gate-card-avatar{width:34px;height:34px;border-radius:9px;background:rgba(0,230,118,0.16);color:#49DE7F;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none;}
.gate-card .gate-card-name{color:#FFFFFF;font-weight:700;font-size:12.5px;line-height:1.3;white-space:nowrap;}
.gate-card .gate-card-role{color:#8FD9A8;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap;}
@keyframes gateFloat{
  0%{transform:translate(0,0) rotate(0deg);}
  25%{transform:translate(14px,-18px) rotate(1.2deg);}
  50%{transform:translate(-6px,10px) rotate(-1deg);}
  75%{transform:translate(-16px,-8px) rotate(0.8deg);}
  100%{transform:translate(0,0) rotate(0deg);}
}
.gate-fade-edge{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(7,39,31,0.25) 0%,rgba(7,39,31,0.75) 60%,rgba(4,20,15,0.95) 100%);pointer-events:none;}

  var CONTENT_SEED = {
    journey: [{"title":"1. Discovery","body":"Most ambassadors are already organic soccer organizers or players before they ever hear of Plei — often running their own pickup games on WhatsApp or Discord, or already a regular at Adidas-sponsored free games."},{"title":"2. Application","body":"Apply through the web form or a flyer. The current bar: fulfill at least 2 of 6 role categories — affiliate marketing, social media, event hosting, content creation, community leadership, or corporate partnerships. See How We Select below for the full list."},{"title":"3. First-round screen","body":"Handled by Spencer or the growth team, filtering the player database and incoming applications for fit before scheduling an interview."},{"title":"4. Second-round interview","body":"A conversational, ~20–30 minute interview with Angel. Regional Supervisor candidates get a second round with Spencer as well, and notes from both are compared before a decision is made."},{"title":"5. Decision","body":"Candidates typically hear back by midweek, or no later than the middle of the following week."},{"title":"6. Onboarding call","body":"Role expectations, your WhatsApp group invite, first assignment, equipment, and the content/social requirement are all walked through together. The full checklist lives on the Getting Started page once you're in."},{"title":"7. Active ambassador life","body":"Monthly all-hands calls, the regional WhatsApp community, hosting games, and posting content become the regular rhythm."},{"title":"8. Growth path","body":"The strongest ambassadors move into Regional Supervisor roles or the new Organizer beta program (self-serve game posting) — Sergio Aceves and Jose in Houston are two real examples of that path."},{"title":"9. Offboarding","body":"Can happen for inactivity, not responding to the program agreement, or not meeting expectations. This is one of the areas the program is still actively defining — see Policies for exactly where that stands today."}],
    selection: [{"title":"The application","body":"The public flyer and form ask for 2 of the 6 role categories below. The requirement is intentionally flexible — meet any one or two from the list — though affiliate marketing and social media are the program's main priorities right now:\n\n• Affiliate marketing\n• Social media\n• Event hosting\n• Content creation\n• Corporate partnerships\n• Community leadership\n\nNot sure if you qualify? Apply anyway — see the Q&A below, or reach out and ask."},{"title":"What we look for","body":"• A micro-influencer profile — roughly 500 to 30,000 followers, and comfortable being \"the face\" of a brand online\n• Already organizing or playing soccer independently — we're looking for organic community builders, not passive applicants\n• Proactive by nature, not waiting to be told what to do\n• Work authorization in the U.S. — a hard requirement for anyone who will be paid"},{"title":"The interview process","body":"Brand Ambassador candidates typically go through one interview, about 20–30 minutes, with Angel. Regional Supervisor candidates go through two — a first round with Spencer, a second with Angel — and notes from both rounds are compared before a joint decision. Either way, you'll hear back within about a week."},{"title":"What we're actually evaluating","body":"• People-management or leadership experience — military, retail, engineering leads, or informally organizing your own group all count\n• Honesty about time and bandwidth — this is roughly a 2–4 hour a week role, as an independent contractor, fully remote\n• Comfort being the example on social media — posting, tagging, engaging\n• How you'd handle a teammate who's unmotivated or checked out\n• The size and credibility of your local soccer network\n• Willingness to give real, sometimes critical feedback — supervisors especially are treated as a feedback loop straight to the product team"}],
    qa: [{"title":"What exactly is the Brand Ambassador program?","body":"It's Plei's network of local soccer organizers and community builders who host games, grow the local Plei community, and represent the brand on the ground and on social media. Most applicants apply before fully understanding what the role involves, so if you're reading this — you're already ahead. It's part-time, remote, and built around people who are already doing this kind of thing anyway."},{"title":"Do I get paid, and how much?","body":"It depends on your role and market. Some Adidas-sponsored game hosting comes with a stipend (roughly $30/game). Regional Supervisors are paid a flat $400/month plus $50/month in game credits. Newer Brand Ambassadors are currently in a game-credits model while the program tests a broader stipend structure — ambassadors onboarded under the older model kept their original $15/hour + unlimited free games terms. Full detail is on the Policies page, and we'll be upfront that this varies by region and partnership."},{"title":"Will this lead to a full-time job at Plei?","body":"Not automatically, and we want to be honest about that up front — it's the single most common misconception about this program. This is a part-time, independent-contractor role. That said, ambassadors who go above and beyond have grown into Regional Supervisor roles and the Organizer beta program, and the people building this program started somewhere similar."},{"title":"What if my city doesn't have Adidas or other paid opportunities yet?","body":"Some regions have more sponsor activity than others right now, and that's a real gap we're working on — not every city has an Adidas or McDonald's partnership yet. In the meantime, the biggest lever you have is building your own local community: recruiting players, hosting consistently, and growing your own following. Regions with strong organic communities tend to get first look at new partnerships as they roll out."},{"title":"What do I need to post, and how often?","body":"At minimum: a story at each game you host, tagging @Plei, plus a group photo before kickoff. Keep your profile photo as an actual photo of you (not the default Plei logo) so players recognize you. Engaging with Plei's official posts — likes, comments, shares — is part of the role too."},{"title":"How is attendance and performance tracked?","body":"Every game gets logged in your region's roster sheet — who showed up, who was late, who no-showed — plus a short note on how the game went. This isn't just paperwork: it protects other players' experience and it's what keeps our brand partners (like Adidas) confident in sponsoring games."},{"title":"What equipment do I need to bring?","body":"Bibs/pennies and balls, at minimum, plus arriving early enough to set up and check gear quality. Supply shipments (especially from Adidas) are sometimes delayed, so build in a buffer and flag shortages to your Regional Supervisor early."},{"title":"Can I still play in the games I host?","body":"Yes, but ambassadors and captains supervise first and only fill open roster spots — you shouldn't take priority over paying or waitlisted players."},{"title":"How do I move up — become a Regional Supervisor or Organizer?","body":"Consistency and initiative are what get noticed: reliable hosting, strong content, growing your local community, and giving useful feedback. See Your Journey above for the growth path, and reach out to your Regional Supervisor or Angel/Spencer if you're interested."},{"title":"What happens if I go inactive?","body":"Honestly — this policy is still being finalized, and we'd rather tell you that than pretend otherwise. What's certain today: everyone needs a signed program agreement on file, and non-responders go through a two-email follow-up before being offboarded. A firm inactivity timeline hasn't been set yet. Check the Policies page for the current status."}],
    resources: [{"title":"Your onboarding checklist","body":"This is the same checklist Angel runs on every onboarding call:\n\n1. Confirm work authorization (required to get paid)\n2. Get added to your region's WhatsApp group — the primary tool for communication and scheduling\n3. Learn the roster/check-in system — a shared Google Sheet per region where you log each game's roster, mark present/absent/late, and leave a short game review\n4. Understand the content requirement — a story per game, tagging @Plei, a group photo before kickoff, and a real profile photo\n5. Understand your equipment responsibilities — bibs/balls, arriving early, quality control, cleanup\n6. Set your first shift and confirm your recurring schedule\n7. Get invited to the monthly all-hands call — community updates, product updates, shout-outs, giveaways\n8. If it applies to you, get connected to the Organizer beta program (self-serve game posting)\n9. Ask your Regional Supervisor for a peer example to model — every region has someone who's \"the standard.\""},{"title":"What comp and stipends look like","body":"Compensation varies by role and market — Adidas game hosting, Regional Supervisor pay, and the newer Brand Ambassador model are all a bit different from each other, and some ambassadors are grandfathered into older terms. The full breakdown, including what's still being decided, is on the Policies page — read it there so you're always seeing the current version."},{"title":"Your portal","body":"This site is your dashboard — your region, your team roster, your credits, schedules, and the leaderboard all live here. It replaces the old mix of WhatsApp threads and Notion pages as the single source of truth for the program."},{"title":"Getting help","body":"If something comes up, the escalation path is: you → your Regional Supervisor → Angel or Spencer. Your Regional Supervisor is your first call for day-to-day questions; Angel and Spencer handle anything your supervisor can't resolve."},{"title":"What we're building next","body":"Ambassador feedback directly drives the product roadmap — not just this portal, but Plei itself. Things currently in motion: the check-in feature you're using now, unique QR codes for referrals, player scoring, and tools for the Organizer program. If you have an idea, say something — that's exactly how the last few features got built."},{"title":"Brand assets","body":"Still a gap we're working on closing — a shared logo kit, social post templates, and suggested \"I'm a Plei ambassador\" caption copy aren't formalized yet. Until then, use your best judgment on branding, keep it professional, and check with your Regional Supervisor if you're unsure."}],
    interview: [{"title":"Opening / logistics — both roles","body":"• Confirm work authorization in the U.S.\n• Explain the time commitment — roughly \"0.25 time,\" 2–4 hrs/week, 1099 independent contractor, fully remote — and ask directly about bandwidth given school, other jobs, or family\n• Ask about existing familiarity with Plei or Adidas games in their city"},{"title":"Core question bank — Brand Ambassador & Regional Supervisor","body":"1. Tell me about your experience managing people, handling communication, or working on/leading a team. (Any leadership evidence counts — military, work, informal group organizing.)\n2. How would you handle a team member or ambassador who isn't fulfilling their responsibilities or isn't engaged?\n3. How would you handle an ambassador who feels they don't have the same opportunities as bigger regions (e.g. Miami/Houston vs. Denver/Kansas City)? — tests empathy and retention thinking.\n4. What keeps you around Plei when there are competing apps and ways to play? — tests genuine passion vs. transactional interest.\n5. Are you comfortable being the example on social media — posting a story, tagging Plei, being visible?\n6. Tell me about your local soccer network/community — how big is it, is it just Plei or other groups too?\n7. What's the soccer culture like in your city — leagues, pickup apps, informal networks?\n8. Do you have any experience with websites, tools, or AI that could help us build out our internal systems? (Regional Supervisor only — our ambassador infrastructure is self-built with AI tools, and supervisors are treated as co-builders.)\n9. What do you think our program or team is missing? What feedback do you have? — deliberately asked every time; supervisors are explicitly a feedback loop to product/engineering.\n10. Close with: Do you have any questions or feedback for me? — always ask, and treat their questions as signal too."},{"title":"Regional Supervisor-specific additions","body":"• Walk through the region's Adidas game logistics — roster checks, stipends, no-shows — and ask how they'd manage it\n• Ask directly about deployment/travel/reliability risk if applicable (e.g. military reserve status)\n• Show them the in-progress supervisor dashboard and gauge their reaction and ideas — this doubles as a product-feedback moment"},{"title":"Interviewer notes & tips","body":"• Prioritize proactive, experienced candidates over passive ones who just want to be told what to do\n• Watch for a common failure pattern: candidates who are motivated at first but disengage after a few weeks — this matters more than onboarding enthusiasm\n• Partnership opportunities (Adidas, McDonald's, etc.) are the single biggest driver of candidate interest — be upfront that not every region has these yet"}]

  function parseCSV(text){
    var rows = []; var row = []; var field = ''; var inQuotes = false;
    text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    for(var i=0; i<text.length; i++){
      var c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
        } else { field += c; }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field = ''; }
        else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
        else { field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(v){ return String(v||'').trim() !== ''; }); });
  }

    if(p.indexOf('captain') !== -1) return 'captain';
    if(p.indexOf('program manager') !== -1 || p.indexOf('manager') !== -1 || p.indexOf('admin') !== -1) return 'pm';
    if(p.indexOf('host') !== -1) return 'host';
    return 'ba';
  }

  }

  function parseRosterCSV(text){
    var rows = parseCSV(text);
    if(!rows.length) return {people:[], error:'That file looks empty.'};
    var header = rows[0].map(function(h){ return String(h||'').trim().toLowerCase(); });
    function col(name){ return header.indexOf(name); }
    var idx = {
      name: col('name'), city: col('city'),
      reportsTo: col('regional supervisor'), region: col('region'), position: col('position'),
      phone: col('phone number'), email: col('email'), address: col('mailing address'),
      workAuth: col('do they have work authotization in the us/canada?'),
      instagram: col('instagram or tik tok (must have one)'),
      inventory: col('current plei bibs/ball inventory'),
      baType: col('type of ba (must be one type minimum)'),
      agreement: col('agreement signed?'),
      notes: col('notes')
    };
    if(idx.name === -1){ return {people:[], error:'Could not find a "Name" column in that file.'}; }
    var people = [];
    for(var r=1; r<rows.length; r++){
      var row = rows[r];
      var name = (row[idx.name] || '').trim();
      if(!name) continue;
      var notes = (idx.notes !== -1 ? row[idx.notes] : '') || '';
      var agreementRaw = (idx.agreement !== -1 ? row[idx.agreement] : '') || '';
      var flagged = CSV_REMOVAL_HINTS.some(function(h){
        return notes.toLowerCase().indexOf(h) !== -1 || agreementRaw.toLowerCase().indexOf(h) !== -1;
      });
      var agreementSigned = /^\s*(✅|yes|y|true)\s*$/i.test(agreementRaw);
      var baTypes = (idx.baType !== -1 ? row[idx.baType] : '') || '';
      baTypes = baTypes.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      people.push({
        name: name,
        city: (idx.city !== -1 ? row[idx.city] : '').trim(),
        region: regionKeyFromName((idx.region !== -1 ? row[idx.region] : '').trim()),
        role: roleFromPosition(idx.position !== -1 ? row[idx.position] : ''),
        reportsTo: (idx.reportsTo !== -1 ? row[idx.reportsTo] : '').trim(),
        baTypes: baTypes,
        status: flagged ? 'inactive' : 'active',
        phone: (idx.phone !== -1 ? row[idx.phone] : '').trim(),

  function generateReferralCode(seed, name){
    var base = String(name || seed || 'ba').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,6) || 'ba';
    var hash = 0; var src = String(seed || name || '');
    for(var i=0;i<src.length;i++){ hash = ((hash<<5) - hash + src.charCodeAt(i)) | 0; }
    var suffix = Math.abs(hash).toString(36).slice(0,4);
    return (base + suffix).toUpperCase();
  }

  function ensureReferralCodes(){
    if(BOOTSTRAPPED_REFCODES) return;
    if(!canManageWrites()) return;
    if(!LOADED.members) return;
    var missing = STATE.members.filter(function(m){ return !m.referralCode; });
    if(!missing.length){ BOOTSTRAPPED_REFCODES = true; return; }
    BOOTSTRAPPED_REFCODES = true;
    var used = {}; STATE.members.forEach(function(m){ if(m.referralCode) used[m.referralCode] = true; });
    var batch = db.batch();
    missing.forEach(function(m){
      var code = generateReferralCode(m.id, m.name);
      var tries = 0;
      while(used[code] && tries < 6){ code = generateReferralCode(m.id + '-' + tries, m.name); tries++; }
      used[code] = true;
      batch.set(db.collection('members').doc(m.id), {referralCode: code}, {merge:true});
    });
    batch.commit().catch(function(){ BOOTSTRAPPED_REFCODES = false; });
  }

    CONTENT_KEYS.forEach(function(key){

      (STATE.content[key]||[]).forEach(function(b){ existing[String(b.title||'').trim().toLowerCase()] = true; });
      (CONTENT_SEED[key]||[]).forEach(function(item, i){

  function findReferralDuplicates(ref){

      if(rosterHit) notes.push('Already on roster: ' + rosterHit.name);
      var appHit = STATE.applications.filter(function(a){ return normalizePhone10(a.phone) === phone; })[0];
      if(appHit) notes.push('Already applied: ' + appHit.name);
      var otherRefHit = STATE.referrals.filter(function(r){ return r.id !== ref.id && normalizePhone10(r.referredPhone) === phone; })[0];
      if(otherRefHit) notes.push('Referred before by ' + (otherRefHit.referredByName || 'someone else'));
    }
    if(email){
      var rosterHitE = STATE.members.filter(function(m){ return normalizeEmailKey((STATE.membersPrivate[m.id]||{}).email) === email; })[0];
      if(rosterHitE && notes.indexOf('Already on roster: ' + rosterHitE.name) === -1) notes.push('Already on roster: ' + rosterHitE.name);

  function normalizePhone10(s){

  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function currentMonthKey(){
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth()+1);
  }
  function monthKeyLabel(key){
    if(!key) return '';
    var parts = String(key).split('-'); var y = parseInt(parts[0],10), m = parseInt(parts[1],10);
    if(!y || !m) return String(key);
    return MONTH_NAMES[m-1] + ' ' + y;
  }
  function monthKeyFromExpiration(expStr){
    var mm, yy;
    var m1 = String(expStr||'').match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    var m2 = !m1 && String(expStr||'').match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
    if(m1){ mm = parseInt(m1[1],10); yy = parseInt(m1[3],10); }
    else if(m2){ mm = parseInt(m2[2],10); yy = parseInt(m2[1],10); }
    else return currentMonthKey();
    mm -= 1; if(mm < 1){ mm = 12; yy -= 1; }
    return yy + '-' + pad2(mm);
  }
  function nextMonthFirstDateStr(){
    var d = new Date();
    var mm = d.getMonth() + 2; var yy = d.getFullYear();
    if(mm > 12){ mm -= 12; yy += 1; }
    return pad2(mm) + '/01/' + yy;
  }
  function monthOptionsList(){
    var out = []; var d = new Date();
    for(var i=0;i<6;i++){
      var yy = d.getFullYear(), mm = d.getMonth()+1 - i;
      while(mm < 1){ mm += 12; yy -= 1; }
      var key = yy + '-' + pad2(mm);
      out.push({key: key, label: monthKeyLabel(key)});
    }
    return out;
  }

  function parseCreditsCSV(text){
    var rows = parseCSV(text);
    if(!rows.length) return {matched:[], unmatched:[], monthKey:'', error:'That file looks empty.'};
    var header = rows[0].map(function(h){ return String(h||'').trim().toLowerCase(); });
    function col(name){ return header.indexOf(name); }
    var idx = {
      phone: col('phone number'), amount: col('credit amount'), category: col('category'),
      reason: col('reason'), expiration: col('expiration date')
    };
    if(idx.phone === -1 || idx.amount === -1){ return {matched:[], unmatched:[], monthKey:'', error:'Could not find "Phone Number" and "Credit Amount" columns in that file.'}; }
    var byPhone = {};
    STATE.members.forEach(function(m){
      var priv = STATE.membersPrivate[m.id] || {};
      var key = normalizePhone10(priv.phone);
      if(key) byPhone[key] = m;
    });
    var matched = [], unmatched = [], expirationSeen = '';
    for(var r=1; r<rows.length; r++){
      var row = rows[r];
      var phoneRaw = ((idx.phone !== -1 ? row[idx.phone] : '') || '').trim();
      var key = normalizePhone10(phoneRaw);
      if(!key) continue;
      var amt = parseFloat(idx.amount !== -1 ? row[idx.amount] : '') || 0;
      var category = ((idx.category !== -1 ? row[idx.category] : '') || '').trim();
      var reason = ((idx.reason !== -1 ? row[idx.reason] : '') || '').trim();
      var expiration = ((idx.expiration !== -1 ? row[idx.expiration] : '') || '').trim();
      if(expiration) expirationSeen = expiration;
      var member = byPhone[key];
      if(member){
        matched.push({memberId: member.id, name: member.name, phone: phoneRaw, amount: amt, category: category, reason: reason, expiration: expiration});
      } else {
        unmatched.push(phoneRaw);
      }
    }
    var monthKey = expirationSeen ? monthKeyFromExpiration(expirationSeen) : currentMonthKey();
    return {matched: matched, unmatched: unmatched, monthKey: monthKey, error: ''};
  }

    var ref = STATE.referrals.filter(function(r){ return r.id === id; })[0];

    var amt = parseFloat(amount) || 0;
    if(amt <= 0) return;
    var batch = db.batch();
    batch.set(db.collection('referral_credits').doc(id), {
      referralId: id, memberId: ref.referredByMemberId, memberName: ref.referredByName || '',
      referredName: ref.referredName || '', amount: amt, region: ref.region || '',
      status: 'pending-export', approvedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
    batch.set(db.collection('referrals').doc(id), {status: 'converted', creditApproved: true, creditAmount: amt}, {merge:true});
    withSaving(batch.commit());
    logAudit('referral-credit', id, ref.referredByName, 'approved $' + amt + ' referral credit for referring ' + (ref.referredName||''));
  }

  function exportReferralCreditsCSV(){
    var pending = STATE.referralCredits.filter(function(c){ return c.status === 'pending-export'; });
    if(!pending.length){ UI.error = 'No approved referral credits are waiting to be exported.'; render(); return; }
    var lines = [['Member Name','Referred Name','Credit Amount','Region'].map(csvEscape).join(',')];
    var batch = db.batch();
    pending.forEach(function(c){
      lines.push([c.memberName||'', c.referredName||'', c.amount||0, regionName(c.region)].map(csvEscape).join(','));
      batch.set(db.collection('referral_credits').doc(c.referralId || c.id), {status: 'exported', exportedAt: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true});
    });
    var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'plei-referral-credits-' + (new Date().toISOString().slice(0,10)) + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    batch.commit().then(function(){
      logAudit('export-referral-credits', '', '', 'exported ' + pending.length + ' referral credits');
    });
  }

  function parseReferralsCSV(text){
    var rows = parseCSV(text);
    if(!rows.length) return {rows:[], error:'That file looks empty.'};
    var header = rows[0].map(function(h){ return String(h||'').trim().toLowerCase(); });
    function col(name){ return header.indexOf(name); }
    var idx = {
      referrerPhone: col('referrer phone'), referrerCode: col('referrer code'),
      name: col('referred name'), phone: col('referred phone'), email: col('referred email'),
      city: col('city'), status: col('status'), date: col('date')
    };
    if(idx.name === -1){ return {rows:[], error:'Could not find a "Referred Name" column in that file.'}; }
    var byPhone = {};
    STATE.members.forEach(function(m){
      var key = normalizePhone10((STATE.membersPrivate[m.id]||{}).phone);
      if(key) byPhone[key] = m;
    });
    var out = [];
    for(var r=1; r<rows.length; r++){
      var row = rows[r];
      var name = (row[idx.name] || '').trim();
      if(!name) continue;
      var refPhone = idx.referrerPhone !== -1 ? normalizePhone10(row[idx.referrerPhone]) : '';
      var refMember = refPhone ? byPhone[refPhone] : null;
      var refCode = idx.referrerCode !== -1 ? (row[idx.referrerCode]||'').trim() : '';
      if(!refMember && refCode){ refMember = memberByReferralCode(refCode); }
      out.push({
        referredName: name,
        referredPhone: (idx.phone !== -1 ? row[idx.phone] : '').trim(),
        referredEmail: (idx.email !== -1 ? row[idx.email] : '').trim(),
        referredCity: (idx.city !== -1 ? row[idx.city] : '').trim(),
        status: (idx.status !== -1 ? row[idx.status] : '').trim().toLowerCase() || 'new',
        referredByMemberId: refMember ? refMember.id : '',
        referredByName: refMember ? refMember.name : '',
        region: refMember ? (refMember.region||'') : '',
        importedDate: (idx.date !== -1 ? row[idx.date] : '').trim()
      });
    }
    return {rows: out, error: ''};
  }

  function computeStats(){
    var active = STATE.members.filter(function(m){ return m.status !== 'inactive'; });
    var totalEvents = active.reduce(function(s,m){ return s + (m.eventsWorked||0); }, 0);
    var agreementCount = 0, agreementKnown = 0;
    var totalCredits = 0, creditedCount = 0;
    if(IS_PLEI_USER){
      active.forEach(function(m){
        var priv = STATE.membersPrivate[m.id];
        if(priv && typeof priv.agreementSigned === 'boolean'){ agreementKnown++; if(priv.agreementSigned) agreementCount++; }
        if(priv && priv.gameCreditAmount != null && priv.gameCreditAmount > 0){ totalCredits += priv.gameCreditAmount; creditedCount++; }
      });
    }
    return {
      active: active.length, cities: cityCount(), totalEvents: totalEvents,
      agreementPct: agreementKnown ? Math.round(100*agreementCount/agreementKnown) : null,
      totalCredits: totalCredits, creditedCount: creditedCount
    };
  }

  function activeFilterCount(){
    return FILTERS.roles.length + FILTERS.regions.length + FILTERS.baTypes.length +
      (FILTERS.agreement !== 'any' ? 1 : 0) + (FILTERS.credits !== 'any' ? 1 : 0) + (FILTERS.minEvents > 0 ? 1 : 0) + (FILTERS.showInactive ? 1 : 0);
  }
  function filteredMembers(){
    return STATE.members.filter(function(m){
      if(!FILTERS.showInactive && m.status === 'inactive') return false;
      if(FILTERS.roles.length && FILTERS.roles.indexOf(m.role) === -1) return false;
      if(FILTERS.regions.length && FILTERS.regions.indexOf(m.region) === -1) return false;
      if(FILTERS.baTypes.length && !FILTERS.baTypes.some(function(t){ return (m.baTypes||[]).indexOf(t) !== -1; })) return false;
      if(FILTERS.agreement !== 'any' && IS_PLEI_USER){
        var priv = STATE.membersPrivate[m.id] || {};
        var signed = priv.agreementSigned === true;
        if(FILTERS.agreement === 'signed' && !signed) return false;
        if(FILTERS.agreement === 'unsigned' && signed) return false;
      }
      if(FILTERS.credits !== 'any' && IS_PLEI_USER){
        var priv2 = STATE.membersPrivate[m.id] || {};
        var hasCredit = priv2.gameCreditAmount != null && priv2.gameCreditAmount > 0;
        if(FILTERS.credits === 'has' && !hasCredit) return false;
        if(FILTERS.credits === 'none' && hasCredit) return false;
      }
      if(FILTERS.minEvents > 0 && (m.eventsWorked||0) < FILTERS.minEvents) return false;
      if(FILTERS.q){
        var q = FILTERS.q.toLowerCase();
        var hay = (m.name + ' ' + (m.city||'')).toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function renderMap(){
    var mapBody;
    if(GEO.error){
      mapBody = '<div class="map-fallback">' + escapeHtml(GEO.error) + ' Showing cities as a list instead:</div>' +
        '<div class="map-fallback-grid">' + REGION_ORDER.map(function(key){

            cities.map(function(c){ return '<div class="map-fallback-city" data-action="pick-city" data-value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</div>'; }).join('') + '</div>';
        }).join('') + '</div>';
    } else if(GEO.loading){
      mapBody = '<div class="map-fallback">Loading map…</div>';
    } else {
      var all = allCitiesWithRegion();
      var unmapped = [];
      var matched = [];
      all.forEach(function(c){
        var coords = findCityCoords(c.city);
        if(coords) matched.push({city:c.city, region:c.region, coords:coords}); else unmapped.push(c);
      });
      var boundsFeature = matched.length ? paddedBoundsFeature(matched.map(function(m){ return m.coords; })) : null;
      var projection = boundsFeature ?
        d3.geoMercator().fitExtent([[20,20],[GEO.width-20,GEO.height-20]], boundsFeature) :
        d3.geoMercator().fitSize([GEO.width, GEO.height], GEO.landFC);
      var pathGen = d3.geoPath(projection);
      var landPathD = pathGen(GEO.landFC);
      var borderPathD = pathGen(GEO.borderGeom);
      var placed = matched.map(function(c){ var xy = projection(c.coords); return {city:c.city, region:c.region, xy:xy}; }).filter(function(p){ return p.xy; });
      var defs = '<defs><filter id="blob-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"></feGaussianBlur></filter></defs>';
      var bubbles = REGION_ORDER.map(function(key){
        var pts = placed.filter(function(p){ return p.region === key; });
        if(!pts.length) return '';
        var xs = pts.map(function(p){ return p.xy[0]; }), ys = pts.map(function(p){ return p.xy[1]; });
        var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
        var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
        var cx = (minX+maxX)/2, cy = (minY+maxY)/2;
        var rx = Math.max(75, (maxX-minX)/2 + 60), ry = Math.max(85, (maxY-minY)/2 + 70);
        var activeClass = (FILTERS.regions.indexOf(key) !== -1) ? ' active' : '';
        return '<ellipse class="map-region' + activeClass + '" filter="url(#blob-soft)" data-action="pick-region" data-value="' + key + '" cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="var(' + REGION_COLOR_VAR[key] + ')"></ellipse>' +
          '<text class="map-label" x="' + cx + '" y="' + (cy - ry + 26) + '" data-action="pick-region" data-value="' + key + '">' + escapeHtml(regionName(key).toUpperCase()) + '</text>';
      }).join('');
      var pins = placed.map(function(p){
        var colorVar = REGION_COLOR_VAR[p.region] || '--accent';
        var labelAnchor = p.xy[0] > GEO.width - 130 ? 'end' : 'start';
        var labelDx = labelAnchor === 'end' ? -8 : 8;
        return '<g class="city-group" data-action="pick-city" data-value="' + escapeHtml(p.city) + '">' +
          '<circle class="pin" cx="' + p.xy[0] + '" cy="' + p.xy[1] + '" r="5" fill="var(' + colorVar + ')"></circle>' +
          '<text class="pin-label" x="' + (p.xy[0] + labelDx) + '" y="' + (p.xy[1] + 3) + '" text-anchor="' + labelAnchor + '">' + escapeHtml(p.city) + '</text>' +
        '</g>';
      }).join('');
      var svg = '<svg viewBox="0 0 ' + GEO.width + ' ' + GEO.height + '" width="100%">' +
        defs +
        '<rect x="0" y="0" width="' + GEO.width + '" height="' + GEO.height + '" class="na-ocean"></rect>' +
        '<path d="' + landPathD + '" class="na-landmass"></path>' +
        '<path d="' + borderPathD + '" class="na-state-lines"></path>' +
        bubbles +
        pins +
      '</svg>';
      var unmappedNote = unmapped.length ? '<div class="map-unmapped-note">Not shown on the map yet (no coordinates on file) — click to filter the roster anyway: ' +
        unmapped.map(function(c){ return '<span class="map-unmapped-city" data-action="pick-city" data-value="' + escapeHtml(c.city) + '">' + escapeHtml(c.city) + '</span>'; }).join(', ') + '</div>' : '';
      mapBody = '<div class="map-svg-wrap">' + svg + '</div>' + unmappedNote;
    }

    var cols = REGION_ORDER.map(function(key){
      var sups = supervisorsForRegion(key);
      return {
        key: key, label: regionName(key), colorVar: REGION_COLOR_VAR[key],
        name: sups.length ? sups.join(', ') : 'Unassigned',
        sub: regionMemberCount(key) + ' on team'
      };
    });
    var pms = programManagers();
    cols.push({key:'', label:'Program Manager', colorVar:'--accent', name: pms.length ? pms.join(', ') : 'Unassigned', sub: 'Runs the program'});
    var tableHtml = cols.map(function(c){
      var activeClass = (c.key && FILTERS.regions.indexOf(c.key) !== -1) ? ' active' : '';
      var headAttrs = c.key ? ' data-action="pick-region" data-value="' + c.key + '"' : '';

  function grantAccess(memberId, email){
    var key = normalizeEmailKey(email);
    if(!memberId){ UI.grantAccessError = 'Pick a team member first.'; render(); return; }
    if(!key || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(key)){ UI.grantAccessError = 'Enter a valid email address.'; render(); return; }
    UI.grantAccessSaving = true; UI.grantAccessError = ''; render();
    db.collection('email_index').doc(key).get().then(function(doc){
      if(doc.exists && doc.data().memberId !== memberId){
        var other = STATE.members.filter(function(m){ return m.id === doc.data().memberId; })[0];
        var e = new Error('taken'); e.code = 'taken'; e.name2 = other ? other.name : 'another member';
        throw e;
      }
      var batch = db.batch();
      writeEmailIndex(batch, memberId, email);
      return batch.commit();
    }).then(function(){
      var m = STATE.members.filter(function(x){ return x.id === memberId; })[0];
      logAudit('grant-access', memberId, m ? m.name : '', 'Granted portal sign-in to ' + key);
      UI.grantAccessSaving = false; UI.grantAccessOpen = false; UI.grantAccessMemberId = ''; UI.grantAccessEmail = '';
      render();
    }).catch(function(err){
      UI.grantAccessSaving = false;
      UI.grantAccessError = (err && err.code === 'taken') ? ('That email already grants access to ' + err.name2 + '. Remove it there first if you want to reassign it.') : 'Could not grant access — please try again.';
      render();
    });
  }

  function renderCreditsPage(){
    if(!IS_PLEI_USER){
      return '<div class="page-header"><h1>Credits</h1></div>' +
        '<div class="internal-note">Game credit tracking is visible to signed-in Plei team members.</div>';
    }
    var stats = computeStats();
    var lifetimeTotal = 0;
    var byMonth = {}; var byMember = {};
    (STATE.creditHistory||[]).forEach(function(h){
      lifetimeTotal += (h.amount||0);
      byMonth[h.month] = byMonth[h.month] || {month: h.month, label: h.monthLabel || monthKeyLabel(h.month), total:0, count:0};
      byMonth[h.month].total += (h.amount||0);
      byMonth[h.month].count += 1;
      byMember[h.memberId] = byMember[h.memberId] || {memberId: h.memberId, name: h.memberName, total:0};
      byMember[h.memberId].total += (h.amount||0);
    });
    var months = Object.keys(byMonth).map(function(k){ return byMonth[k]; }).sort(function(a,b){ return b.month.localeCompare(a.month); });
    var memberTotals = Object.keys(byMember).map(function(k){ return byMember[k]; }).sort(function(a,b){ return b.total - a.total; });
    var tiles = [
      {n: '$' + stats.totalCredits, label: stats.creditedCount + ' Ambassadors With Credits Now'},
      {n: '$' + lifetimeTotal, label: 'Lifetime Credits Issued'},
      {n: months.length, label: 'Months Tracked'}
    ];
    var statHtml = tiles.map(function(t){ return '<div class="stat-tile"><div class="stat-num tabular">' + t.n + '</div><div class="stat-label">' + t.label + '</div></div>'; }).join('');
    var monthRows = months.map(function(mo){
      return '<div class="leader-item"><span>' + escapeHtml(mo.label) + ' — ' + mo.count + ' ambassador' + (mo.count===1?'':'s') + '</span><span class="n tabular">$' + mo.total + '</span></div>';
    }).join('');
    var memberRows = memberTotals.slice(0,50).map(function(mm,i){
      return '<div class="leader-item"><span><span class="rank">' + (i+1) + '.</span>' + escapeHtml(mm.name||mm.memberId) + '</span><span class="n tabular">$' + mm.total + '</span></div>';
    }).join('');
    var usageMonths = {};
    (STATE.usageHistory||[]).forEach(function(u){ usageMonths[u.month] = true; });
    var latestUsageMonth = Object.keys(usageMonths).sort().pop();
    var usageRows = (STATE.usageHistory||[]).filter(function(u){ return u.month === latestUsageMonth; })
      .sort(function(a,b){ return (b.gamesPlayed||0) - (a.gamesPlayed||0); })
      .map(function(u){
        return '<div class="leader-item"><span>' + escapeHtml(u.memberName||u.memberId) + '</span>' +

      }).join('');

  function bindHandlers(){
    var app = document.getElementById('app');
    app.querySelectorAll('[data-action]').forEach(function(el){
      var action = el.getAttribute('data-action');
      if(action === 'sign-in'){
        el.addEventListener('click', signIn);
      } else if(action === 'sign-out'){
        el.addEventListener('click', signOutUser);
      } else if(action === 'seed-defaults'){
        el.addEventListener('click', seedDefaults);
      } else if(action === 'pick-region'){
        el.addEventListener('click', function(){
          var key = el.getAttribute('data-value');
          FILTERS.regions = (FILTERS.regions.length===1 && FILTERS.regions[0]===key) ? [] : [key];
          render();
          var sec = document.getElementById('roster-section'); if(sec) sec.scrollIntoView({behavior:'smooth', block:'start'});
        });
      } else if(action === 'toggle-filter-panel'){
        el.addEventListener('click', function(){ UI.filterPanelOpen = !UI.filterPanelOpen; render(); });
      } else if(action === 'filter-role-check'){
        el.addEventListener('change', function(){
          var v = el.getAttribute('data-value'); var i = FILTERS.roles.indexOf(v);
          if(el.checked && i===-1) FILTERS.roles.push(v); else if(!el.checked && i!==-1) FILTERS.roles.splice(i,1);
          render();
        });
      } else if(action === 'filter-region-check'){
        el.addEventListener('change', function(){
          var v = el.getAttribute('data-value'); var i = FILTERS.regions.indexOf(v);
          if(el.checked && i===-1) FILTERS.regions.push(v); else if(!el.checked && i!==-1) FILTERS.regions.splice(i,1);
          render();
        });
      } else if(action === 'filter-batype-check'){
        el.addEventListener('change', function(){
          var v = el.getAttribute('data-value'); var i = FILTERS.baTypes.indexOf(v);
          if(el.checked && i===-1) FILTERS.baTypes.push(v); else if(!el.checked && i!==-1) FILTERS.baTypes.splice(i,1);
          render();
        });
      } else if(action === 'filter-agreement'){
        el.addEventListener('change', function(){ FILTERS.agreement = el.value; render(); });
      } else if(action === 'filter-credits'){
        el.addEventListener('change', function(){ FILTERS.credits = el.value; render(); });
      } else if(action === 'add-batype-filter'){
        el.addEventListener('click', function(){
          var input = document.getElementById('f-filter-newtype');
          var tag = input ? input.value.trim() : '';
          if(!tag) return;
          addBaType(tag);
          if(FILTERS.baTypes.indexOf(tag) === -1) FILTERS.baTypes.push(tag);
          render();
        });
      } else if(action === 'search'){
        el.addEventListener('input', function(){ FILTERS.q = el.value; render(); var input = document.querySelector('.search-input'); if(input){ input.focus(); input.setSelectionRange(input.value.length, input.value.length);} });
      } else if(action === 'open-member'){
        el.addEventListener('click', function(){ UI.selectedId = el.getAttribute('data-value'); render(); });
      } else if(action === 'close-modal'){
        el.addEventListener('click', function(){ UI.selectedId = null; render(); });
      } else if(action === 'add-member'){
        el.addEventListener('click', function(){ UI.adding = true; UI.editingId = null; UI.selectedId = null; UI.formBaTypes = []; UI.pendingNewTypes = []; render(); });
      } else if(action === 'edit-member'){
        el.addEventListener('click', function(){
          var id = el.getAttribute('data-value');
          var m = STATE.members.filter(function(x){ return x.id === id; })[0];
          UI.editingId = id; UI.adding = false; UI.selectedId = null;
          UI.formBaTypes = (m && m.baTypes) ? m.baTypes.slice() : []; UI.pendingNewTypes = [];
          render();
        });

        el.addEventListener('click', function(){
          var id = el.getAttribute('data-value');

          logAudit('delete', id, m ? m.name : id, 'removed from roster');

          deleteMember(id);
        });

        el.addEventListener('click', function(){ UI.adding = false; UI.editingId = null; UI.formBaTypes = []; render(); });
      } else if(action === 'toggle-form-batype'){
        el.addEventListener('change', function(){
          var v = el.getAttribute('data-value'); var i = UI.formBaTypes.indexOf(v);
          if(el.checked && i===-1) UI.formBaTypes.push(v); else if(!el.checked && i!==-1) UI.formBaTypes.splice(i,1);
          render();
        });
      } else if(action === 'add-batype-form'){
        el.addEventListener('click', function(){
          var input = document.getElementById('f-newbatype');
          var tag = input ? input.value.trim() : '';
          if(!tag) return;
          addBaType(tag);
          if(UI.formBaTypes.indexOf(tag) === -1) UI.formBaTypes.push(tag);
          render();
        });
      } else if(action === 'save-member'){
        el.addEventListener('click', function(){
          var id = el.getAttribute('data-value');
          var data = {
            name: document.getElementById('f-name').value.trim() || 'Unnamed',
            region: document.getElementById('f-region').value,
            role: document.getElementById('f-role').value,
            city: document.getElementById('f-city').value.trim(),

            baTypes: UI.formBaTypes.slice(),
            startDate: document.getElementById('f-start').value.trim(),
            profession: document.getElementById('f-profession').value.trim(),
            eventsWorked: parseInt(document.getElementById('f-events').value, 10) || 0,
            status: document.getElementById('f-status').value,
            experience: document.getElementById('f-experience').value.trim()
          };
          var privateData = {
            phone: document.getElementById('f-phone').value.trim(),
            email: document.getElementById('f-email').value.trim(),
            instagram: document.getElementById('f-instagram').value.trim(),
            workAuth: document.getElementById('f-workauth').value.trim(),
            mailingAddress: document.getElementById('f-address').value.trim(),
            bibBallInventory: document.getElementById('f-inventory').value.trim(),
            agreementSigned: document.getElementById('f-agreement').value === 'yes',
            agreementLink: document.getElementById('f-agreement-link').value.trim()
          };
          var creditAmountVal = parseFloat(document.getElementById('f-credit-amount').value) || 0;
          privateData.gameCreditAmount = creditAmountVal;
          privateData.gameCreditCategory = document.getElementById('f-credit-category').value.trim();
          privateData.gameCreditReason = document.getElementById('f-credit-reason').value.trim();
          privateData.gameCreditMonth = creditAmountVal > 0 ? monthKeyLabel(currentMonthKey()) : '';
          var prevPublic = id ? STATE.members.filter(function(x){ return x.id === id; })[0] : null;
          var prevPrivate = id ? (STATE.membersPrivate[id] || {}) : {};
          var changed = [];
          var sensitiveNotes = [];
          if(prevPublic){
            Object.keys(data).forEach(function(k){ if(JSON.stringify(prevPublic[k]) !== JSON.stringify(data[k])) changed.push(k); });
            Object.keys(privateData).forEach(function(k){ if(JSON.stringify(prevPrivate[k]) !== JSON.stringify(privateData[k])) changed.push(k); });
            if(prevPublic.role !== data.role) sensitiveNotes.push('role: ' + (prevPublic.role || '—') + ' -> ' + (data.role || '—'));
            if(prevPublic.region !== data.region) sensitiveNotes.push('region: ' + (prevPublic.region || '—') + ' -> ' + (data.region || '—'));
          }
          var saveNote = id ? ('changed: ' + (changed.join(', ') || '—') + (sensitiveNotes.length ? ' | ' + sensitiveNotes.join('; ') : '')) : 'new member added (role: ' + (data.role || '—') + ', region: ' + (data.region || '—') + ')';
          logAudit(id ? 'update' : 'create', id, data.name, saveNote);
          UI.adding = false; UI.editingId = null; UI.formBaTypes = []; render();
          saveMember(id || null, data, privateData);
        });

          };
          reader.onerror = function(){ UI.importError = 'Could not read that file.'; render(); };
          reader.readAsText(file);
        });
      } else if(action === 'confirm-import'){
        el.addEventListener('click', function(){
          if(!UI.importRows) return;

          submitReferral(data);
        });
      } else if(action === 'refer-again'){
        el.addEventListener('click', function(){ UI.referSubmitted = false; render(); });
      } else if(action === 'referral-set-status'){
        el.addEventListener('click', function(){ updateReferralStatus(el.getAttribute('data-value'), el.getAttribute('data-status')); });
      } else if(action === 'approve-referral-credit'){
        el.addEventListener('click', function(){
          var id = el.getAttribute('data-value');
          var amtInput = document.getElementById('ref-credit-amt-' + id);
          approveReferralCredit(id, amtInput ? amtInput.value : 0);
        });
      } else if(action === 'export-referral-credits'){
        el.addEventListener('click', exportReferralCreditsCSV);
      } else if(action === 'open-referral-import'){
        el.addEventListener('click', function(){ UI.referralImportOpen = true; UI.referralImportRows = null; UI.referralImportError = ''; render(); });
      } else if(action === 'close-referral-import'){
        el.addEventListener('click', function(){ UI.referralImportOpen = false; UI.referralImportRows = null; UI.referralImportError = ''; render(); });
      } else if(action === 'referral-import-file'){
        el.addEventListener('change', function(){
          var file = el.files && el.files[0];
          if(!file) return;
          var reader = new FileReader();
          reader.onload = function(e){
            var parsed = parseReferralsCSV(String(e.target.result||''));
            if(parsed.error){ UI.referralImportError = parsed.error; UI.referralImportRows = null; }
            else { UI.referralImportRows = parsed.rows; UI.referralImportError = ''; }
            render();
          };
          reader.onerror = function(){ UI.referralImportError = 'Could not read that file.'; render(); };
          reader.readAsText(file);
        });
      } else if(action === 'confirm-referral-import'){
        el.addEventListener('click', function(){
          if(!UI.referralImportRows) return;
          importReferrals(UI.referralImportRows);
        });
      } else if(action === 'open-grant-access'){
        el.addEventListener('click', function(){ UI.grantAccessOpen = true; UI.grantAccessMemberId = ''; UI.grantAccessEmail = ''; UI.grantAccessError = ''; render(); });
      } else if(action === 'close-grant-access'){
        el.addEventListener('click', function(){ UI.grantAccessOpen = false; UI.grantAccessError = ''; render(); });
      } else if(action === 'confirm-grant-access'){
        el.addEventListener('click', function(){
          var memberId = document.getElementById('grant-member').value;
          var email = document.getElementById('grant-email').value;
          grantAccess(memberId, email);
        });
      } else if(action === 'add-policy'){
        el.addEventListener('click', function(){ UI.addingPolicy = true; UI.editingPolicyId = null; render(); });
      } else if(action === 'edit-policy'){
        el.addEventListener('click', function(){ UI.editingPolicyId = el.getAttribute('data-value'); UI.addingPolicy = false; render(); });
      } else if(action === 'delete-policy'){
        el.addEventListener('click', function(){ deletePolicy(el.getAttribute('data-value')); });
      } else if(action === 'close-policy-form'){
        el.addEventListener('click', function(){ UI.addingPolicy = false; UI.editingPolicyId = null; render(); });
      } else if(action === 'save-policy'){
        el.addEventListener('click', function(){
          var id = el.getAttribute('data-value');
          var data = {
            title: document.getElementById('pol-title').value.trim() || 'Untitled',
            body: document.getElementById('pol-body').value.trim(),
            order: parseInt(document.getElementById('pol-order').value, 10) || 0,
            status: document.getElementById('pol-status').value || 'active',
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          };
          UI.addingPolicy = false; UI.editingPolicyId = null; render();
          savePolicy(id || null, data);
        });
      } else if(action === 'add-content'){
        el.addEventListener('click', function(){ UI.contentEditKey = el.getAttribute('data-key'); UI.contentEditId = ''; render(); });
      } else if(action === 'edit-content'){
        el.addEventListener('click', function(){ UI.contentEditKey = el.getAttribute('data-key'); UI.contentEditId = el.getAttribute('data-value'); render(); });
      } else if(action === 'delete-content'){
        el.addEventListener('click', function(){ deleteContent(el.getAttribute('data-key'), el.getAttribute('data-value')); });
      } else if(action === 'close-content-form'){
        el.addEventListener('click', function(){ UI.contentEditKey = ''; UI.contentEditId = ''; render(); });
      } else if(action === 'save-content'){
        el.addEventListener('click', function(){
          var key = el.getAttribute('data-key');
          var id = el.getAttribute('data-value');
          var data = {
            title: document.getElementById('ct-title').value.trim() || 'Untitled',
            body: document.getElementById('ct-body').value.trim(),
            order: parseInt(document.getElementById('ct-order').value, 10) || 0
          };
          UI.contentEditKey = ''; UI.contentEditId = ''; render();
          saveContent(key, id || null, data);
        });
      }
    });
  }

  render();
})();
</script>
</body>
</html>

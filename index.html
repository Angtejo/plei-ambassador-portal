<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Plei Ambassador Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --surface-2:#F1F3F5;
  --surface-3:#EDEFF2;
  --border:#E4E7EB;
  --accent:#1F7A4D;
  --accent-2:#28965F;
  --accent-soft:#EAF7EF;
  --on-accent:#FFFFFF;
  --text:#15181C;
  --text-muted:#6B7280;
  --text-faint:#9AA1AB;
  --warn:#C0432A;
  --warn-soft:#FBEAE6;
  --badge-ba-bg:#EAF7EF; --badge-ba-fg:#1F7A4D;
  --badge-cap-bg:#FBF1D8; --badge-cap-fg:#8A6A1B;
  --badge-sup-bg:#F1EAFB; --badge-sup-fg:#6D3FC2;
  --badge-pm-bg:#E7F0FC;  --badge-pm-fg:#2058B0;
  --west:#5B8FC7; --central:#DB9A55; --southeast:#A47FCB; --northeast:#B99B3E;
  --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(16,24,32,0.05);
  --shadow-md:0 4px 14px rgba(16,24,32,0.07);
  --shadow-lg:0 12px 32px rgba(16,24,32,0.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
#app{max-width:1240px;margin:0 auto;padding:28px 24px 80px;}
::selection{background:var(--accent);color:var(--bg);}
a{color:var(--accent-2);}
button{font-family:inherit;}
.tabular{font-variant-numeric:tabular-nums;}

.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:22px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--on-accent);font-size:15px;flex:none;}
.brand-name{font-weight:800;font-size:15px;letter-spacing:0.2px;}
.eyebrow{display:inline-block;background:var(--accent);color:var(--bg);font-weight:700;font-size:11.5px;padding:5px 13px;border-radius:999px;letter-spacing:0.5px;text-transform:uppercase;}
h1{font-size:28px;font-weight:800;margin:10px 0 2px;text-wrap:balance;}
.sub{color:var(--text-muted);font-size:14px;margin:0;}
.topbar-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.status-pill{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--border);color:var(--text-muted);white-space:nowrap;}
.status-pill.editing{border-color:var(--accent);color:var(--accent);}
.status-pill.readonly{border-color:var(--warn);color:var(--warn);}
.auth-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;}
.auth-btn:hover{border-color:var(--accent-2);color:var(--accent-2);}
.auth-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.auth-btn.primary:hover{background:var(--accent-2);}

.filterbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px;}
.filtergroup{display:flex;flex-wrap:wrap;gap:8px;}
.pill-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
.pill-btn:hover{border-color:var(--accent-2);color:var(--text);}
.pill-btn.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.pill-btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}
.search-input{background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:13px;padding:8px 14px;border-radius:999px;min-width:180px;}
.search-input::placeholder{color:var(--text-faint);}
.search-input:focus{outline:2px solid var(--accent-2);outline-offset:1px;}

.card{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-sm);}
.card-pad{padding:24px;}

.map-layout{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;margin-bottom:36px;}
@media (max-width:880px){.map-layout{grid-template-columns:1fr;}}
.map-svg-wrap{position:relative;}
.map-svg-wrap svg{display:block;width:100%;height:auto;}
.map-region{cursor:pointer;opacity:0.68;transition:opacity .15s;}
.map-region:hover,.map-region.active{opacity:0.95;}
.map-label{font-weight:800;font-size:19px;fill:var(--text);pointer-events:none;text-anchor:middle;}
.map-dot{fill:var(--accent);stroke:var(--bg);stroke-width:2;}
.stat-row{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;}
.stat-tile{flex:1;min-width:120px;background:var(--surface-2);border-radius:var(--radius-md);padding:14px 16px;}
.stat-num{font-size:22px;font-weight:800;}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:2px;}
.leaders-list{display:flex;flex-direction:column;}
.leader-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);gap:10px;}
.leader-row:last-child{border-bottom:none;}
.leader-name{font-weight:700;font-size:14px;}
.leader-sub{font-size:12px;color:var(--text-muted);margin-top:1px;}
.leader-region-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;}

.badge{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:0.2px;text-transform:uppercase;white-space:nowrap;}
.badge-ba{background:var(--badge-ba-bg);color:var(--badge-ba-fg);}
.badge-captain{background:var(--badge-cap-bg);color:var(--badge-cap-fg);}
.badge-supervisor{background:var(--badge-sup-bg);color:var(--badge-sup-fg);}
.badge-pm{background:var(--badge-pm-bg);color:var(--badge-pm-fg);}
.badge-outline{border:1px solid var(--border);color:var(--text-muted);background:transparent;}

.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:0 0 16px;flex-wrap:wrap;}
.section-head h2{font-size:19px;font-weight:800;margin:0;}
.section-head .count{color:var(--text-muted);font-size:13px;}
.btn{background:var(--accent);color:var(--on-accent);border:none;font-weight:700;font-size:13px;padding:10px 18px;border-radius:999px;cursor:pointer;}
.btn:hover{background:var(--accent-2);}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn.secondary:hover{border-color:var(--accent-2);color:var(--accent-2);}
.btn.danger{background:transparent;border:1px solid var(--warn);color:var(--warn);}
.btn:disabled{opacity:0.5;cursor:default;}
.btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;}
.icon-btn:hover{border-color:var(--accent-2);color:var(--accent-2);}

.roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:40px;}
.member-card{background:var(--surface);border-radius:var(--radius-lg);padding:18px;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s;}
.member-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md);}
.member-top{display:flex;gap:12px;align-items:center;}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent);font-size:15px;flex:none;}
.member-name{font-weight:700;font-size:14.5px;}
.member-city{font-size:12px;color:var(--text-muted);}
.member-meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.member-events{font-size:12px;color:var(--text-muted);}
.empty-note{color:var(--text-faint);font-size:13px;padding:20px 4px;}
.empty-actions{padding:4px;}

.overlay{position:fixed;inset:0;background:rgba(15,23,31,0.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;overflow-y:auto;z-index:40;}
.modal{background:var(--surface);border-radius:var(--radius-lg);max-width:640px;width:100%;padding:0;overflow:hidden;box-shadow:var(--shadow-lg);}
.modal-body{padding:28px;}
.modal-header{display:flex;align-items:flex-start;gap:16px;}
.modal-avatar{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:var(--accent);flex:none;}
.modal-heading{flex:1;min-width:0;}
.modal-heading h2{margin:0;font-size:20px;font-weight:800;}
.modal-heading .sub{margin-top:3px;}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 20px;}
.tag{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--border);color:var(--text-muted);background:var(--surface);}
.section-label{font-size:11.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;margin:22px 0 10px;}
.week-list{display:flex;flex-direction:column;gap:8px;}
.week-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 14px;gap:10px;}
.week-day{font-weight:700;font-size:13px;}
.week-value{font-size:13px;color:var(--text-muted);}
.week-status{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:uppercase;white-space:nowrap;}
.week-status.on{background:var(--accent-soft);color:var(--accent);}
.week-status.off{background:var(--surface-2);color:var(--text-faint);}
.about-text{font-size:13.5px;color:var(--text-muted);line-height:1.6;margin-top:2px;}
.modal-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
@media (max-width:520px){.form-grid{grid-template-columns:1fr;}}
.form-field{display:flex;flex-direction:column;gap:5px;grid-column:span 1;}
.form-field.full{grid-column:1 / -1;}
.form-field label{font-size:11.5px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.3px;}
.form-field input,.form-field select,.form-field textarea{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:9px 11px;border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;
}
.form-field textarea{resize:vertical;min-height:64px;}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:2px solid var(--accent-2);outline-offset:1px;}

.kv-row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.kv-row:last-child{border-bottom:none;}
.kv-row .k{color:var(--text-muted);white-space:nowrap;}
.kv-row .v{font-weight:600;text-align:right;max-width:62%;word-break:break-word;}
.badge-inactive{background:var(--warn-soft);color:var(--warn);}
.import-dropzone{border:2px dashed var(--border);border-radius:var(--radius-md);padding:26px;text-align:center;color:var(--text-muted);font-size:13px;}
.import-dropzone input{margin-top:10px;}
.import-summary{font-size:13px;color:var(--text-muted);margin:14px 0;white-space:pre-line;}
.checkbox-row{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-muted);cursor:pointer;}

.bottom-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:20px;align-items:start;}
@media (max-width:880px){.bottom-layout{grid-template-columns:1fr;}}
.sched-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.sched-table th{text-align:left;color:var(--text-muted);font-weight:600;padding:6px 6px;font-size:11.5px;}
.sched-table td{padding:4px;}
.sched-name{font-weight:700;font-size:13px;white-space:nowrap;padding-right:10px;}
.sched-cell input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 7px;font-size:11.5px;font-family:inherit;}
.sched-cell input:focus{outline:2px solid var(--accent-2);}
.sched-wrap{overflow-x:auto;}
.leader-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.leader-item:last-child{border-bottom:none;}
.leader-item .rank{width:22px;display:inline-block;}
.leader-item.warn{color:var(--warn);}
.leader-item .n{font-weight:800;}
.readonly-banner{background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);border-radius:var(--radius-md);padding:12px 16px;font-size:13px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
.readonly-banner.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);}
.internal-note{background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);border-radius:var(--radius-md);padding:16px;font-size:13px;}
.footer-note{color:var(--text-faint);font-size:12px;margin-top:36px;text-align:center;}
.saving-note{font-size:12px;color:var(--text-muted);margin-top:8px;}
.error-note{font-size:12px;color:var(--warn);margin-top:8px;}
.log-list{display:flex;flex-direction:column;max-height:60vh;overflow-y:auto;}
.log-row{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
.log-row:last-child{border-bottom:none;}
.log-meta{color:var(--text-muted);font-size:11.5px;margin-top:2px;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.overlay{animation:fadeIn .12s ease;}
.modal{animation:modalIn .16s ease;}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var firebaseConfig = {"apiKey":"AIzaSyCO9E63unOgEOWs0sziLIxMP6mk0k9VrCY","authDomain":"plei-ambassador-portal.firebaseapp.com","projectId":"plei-ambassador-portal","storageBucket":"plei-ambassador-portal.firebasestorage.app","messagingSenderId":"189941388682","appId":"1:189941388682:web:ca96accda3f0d5e1492473"};
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var ROLE_LABELS = {ba:'Brand Ambassador', captain:'Captain', supervisor:'Regional Supervisor', pm:'Program Manager'};
  var ROLE_BADGE_CLASS = {ba:'badge-ba', captain:'badge-captain', supervisor:'badge-supervisor', pm:'badge-pm'};
  var REGION_ORDER = ['west','central','southeast','northeast'];
  var REGION_COLOR_VAR = {west:'--west', central:'--central', southeast:'--southeast', northeast:'--northeast'};
  var DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function initials(name){
    var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return '?';
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }

  var STATE = {
    regions: {},
    members: [],
    membersPrivate: {},
    auditLog: [],
    schedule: {weekLabel:'This week', days: DAYS, assignments: {}}
  };
  var LOADED = {regions:false, members:false, schedule:false};
  var CURRENT_USER = null;
  var IS_PLEI_USER = false;
  var SCHEDULE_UNSUB = null;
  var PRIVATE_UNSUB = null;
  var AUDIT_UNSUB = null;

  var FILTERS = {role:'all', region:'all', baType:'all', minEvents:0, showInactive:false, q:''};
  var UI = {selectedId:null, adding:false, editingId:null, editingRegions:false, auditOpen:false, saving:false, seeding:false, importing:false, importOpen:false, importRows:null, importError:'', error:'', authError:''};

  function isPleiEmail(user){
    return !!(user && user.email && /@plei\.com$/i.test(user.email) && user.emailVerified);
  }

  function signIn(){
    UI.authError = '';
    var provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({hd: 'plei.com'});
    auth.signInWithPopup(provider).catch(function(err){
      if(err && err.code === 'auth/popup-closed-by-user') return;
      UI.authError = 'Sign-in failed — please try again.';
      render();
    });
  }
  function signOutUser(){ auth.signOut(); }

  auth.onAuthStateChanged(function(user){
    CURRENT_USER = user;
    IS_PLEI_USER = isPleiEmail(user);
    if(SCHEDULE_UNSUB){ SCHEDULE_UNSUB(); SCHEDULE_UNSUB = null; }
    if(PRIVATE_UNSUB){ PRIVATE_UNSUB(); PRIVATE_UNSUB = null; }
    if(AUDIT_UNSUB){ AUDIT_UNSUB(); AUDIT_UNSUB = null; }
    LOADED.schedule = false;
    STATE.membersPrivate = {};
    STATE.auditLog = [];
    if(IS_PLEI_USER){
      SCHEDULE_UNSUB = db.collection('schedule').doc('current').onSnapshot(function(doc){
        LOADED.schedule = true;
        if(doc.exists){
          var d = doc.data();
          STATE.schedule = {weekLabel: d.weekLabel || 'This week', days: d.days || DAYS, assignments: d.assignments || {}};
        }
        render();
      }, function(){ LOADED.schedule = true; render(); });
      PRIVATE_UNSUB = db.collection('members_private').onSnapshot(function(snap){
        var next = {};
        snap.forEach(function(doc){ next[doc.id] = doc.data(); });
        STATE.membersPrivate = next;
        render();
      }, function(){ render(); });
      AUDIT_UNSUB = db.collection('audit_log').orderBy('editedAt','desc').limit(20).onSnapshot(function(snap){
        var next = [];
        snap.forEach(function(doc){ next.push(doc.data()); });
        STATE.auditLog = next;
        render();
      }, function(){ render(); });
    } else {
      STATE.schedule = {weekLabel:'This week', days: DAYS, assignments: {}};
    }
    render();
  });

  db.collection('regions').onSnapshot(function(snap){
    var next = {};
    snap.forEach(function(doc){ next[doc.id] = doc.data(); });
    STATE.regions = next;
    LOADED.regions = true;
    render();
  }, function(){ LOADED.regions = true; render(); });

  db.collection('members').onSnapshot(function(snap){
    var next = [];
    snap.forEach(function(doc){ next.push(Object.assign({id: doc.id}, doc.data())); });
    STATE.members = next;
    LOADED.members = true;
    render();
  }, function(){ LOADED.members = true; render(); });

  function seedDefaults(){
    UI.seeding = true; UI.error=''; render();
    var batch = db.batch();
    var regions = {
      west: {name:'West', supervisor:'Robin Palacios'},
      central: {name:'Central', supervisor:'Angel Montejo'},
      southeast: {name:'Southeast', supervisor:'Salaheldin Mohamed'},
      northeast: {name:'Northeast', supervisor:'Charles Elder'}
    };
    Object.keys(regions).forEach(function(key){ batch.set(db.collection('regions').doc(key), regions[key]); });
    var members = [
      {id:'sup-west', name:'Robin Palacios', region:'west', role:'supervisor', city:'', startDate:'', experience:'', profession:'', eventsWorked:0},
      {id:'sup-central', name:'Angel Montejo', region:'central', role:'pm', city:'', startDate:'', experience:'Runs the Brand Ambassador Program and doubles as Central region supervisor.', profession:'', eventsWorked:0},
      {id:'sup-southeast', name:'Salaheldin Mohamed', region:'southeast', role:'supervisor', city:'', startDate:'', experience:'Building this portal.', profession:'Computer Engineer', eventsWorked:0},
      {id:'sup-northeast', name:'Charles Elder', region:'northeast', role:'supervisor', city:'', startDate:'', experience:'', profession:'', eventsWorked:0}
    ];
    members.forEach(function(m){ var data = Object.assign({}, m); delete data.id; batch.set(db.collection('members').doc(m.id), data); });
    batch.set(db.collection('schedule').doc('current'), {weekLabel:'This week', days: DAYS, assignments: {}});
    batch.commit().then(function(){ UI.seeding = false; render(); }).catch(function(){ UI.seeding = false; UI.error = 'Could not set up default data — please try again.'; render(); });
  }

  function parseCSV(text){
    var rows = []; var row = []; var field = ''; var inQuotes = false;
    text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    for(var i=0; i<text.length; i++){
      var c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
        } else { field += c; }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field = ''; }
        else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
        else { field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(v){ return String(v||'').trim() !== ''; }); });
  }

  var CSV_REMOVAL_HINTS = ['remove him','remove her','remove them','will be removed'];
  function roleFromPosition(pos){
    var p = String(pos||'').toLowerCase();
    if(p.indexOf('supervisor') !== -1) return 'supervisor';
    if(p.indexOf('captain') !== -1) return 'captain';
    if(p.indexOf('program manager') !== -1) return 'pm';
    return 'ba';
  }
  function regionKeyFromName(name){
    var n = String(name||'').toLowerCase();
    var found = REGION_ORDER.filter(function(k){ return k === n; })[0];
    return found || n;
  }
  function slugifyId(name, i){
    var base = String(name||'member').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    return (base || 'member') + '-' + i;
  }

  function parseRosterCSV(text){
    var rows = parseCSV(text);
    if(!rows.length) return {people:[], error:'That file looks empty.'};
    var header = rows[0].map(function(h){ return String(h||'').trim().toLowerCase(); });
    function col(name){ return header.indexOf(name); }
    var idx = {
      name: col('name'), city: col('city'),
      reportsTo: col('regional supervisor'), region: col('region'), position: col('position'),
      phone: col('phone number'), email: col('email'), address: col('mailing address'),
      workAuth: col('do they have work authotization in the us/canada?'),
      instagram: col('instagram or tik tok (must have one)'),
      inventory: col('current plei bibs/ball inventory'),
      baType: col('type of ba (must be one type minimum)'),
      agreement: col('agreement signed?'),
      notes: col('notes')
    };
    if(idx.name === -1){ return {people:[], error:'Could not find a "Name" column in that file.'}; }
    var people = [];
    for(var r=1; r<rows.length; r++){
      var row = rows[r];
      var name = (row[idx.name] || '').trim();
      if(!name) continue;
      var notes = (idx.notes !== -1 ? row[idx.notes] : '') || '';
      var agreementRaw = (idx.agreement !== -1 ? row[idx.agreement] : '') || '';
      var flagged = CSV_REMOVAL_HINTS.some(function(h){
        return notes.toLowerCase().indexOf(h) !== -1 || agreementRaw.toLowerCase().indexOf(h) !== -1;
      });
      var agreementSigned = /^\s*(✅|yes|y|true)\s*$/i.test(agreementRaw);
      var baTypes = (idx.baType !== -1 ? row[idx.baType] : '') || '';
      baTypes = baTypes.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      people.push({
        name: name,
        city: (idx.city !== -1 ? row[idx.city] : '').trim(),
        region: regionKeyFromName((idx.region !== -1 ? row[idx.region] : '').trim()),
        role: roleFromPosition(idx.position !== -1 ? row[idx.position] : ''),
        reportsTo: (idx.reportsTo !== -1 ? row[idx.reportsTo] : '').trim(),
        baTypes: baTypes,
        status: flagged ? 'inactive' : 'active',
        phone: (idx.phone !== -1 ? row[idx.phone] : '').trim(),
        email: (idx.email !== -1 ? row[idx.email] : '').trim(),
        mailingAddress: (idx.address !== -1 ? row[idx.address] : '').trim(),
        workAuth: (idx.workAuth !== -1 ? row[idx.workAuth] : '').trim(),
        instagram: (idx.instagram !== -1 ? row[idx.instagram] : '').trim(),
        bibBallInventory: (idx.inventory !== -1 ? row[idx.inventory] : '').trim(),
        agreementSigned: agreementSigned
      });
    }
    return {people: people, error: ''};
  }

  function importRoster(people){
    UI.importing = true; UI.importError = ''; render();
    var batch = db.batch();
    people.forEach(function(p, i){
      var id = slugifyId(p.name, i);
      batch.set(db.collection('members').doc(id), {
        name: p.name, city: p.city, region: p.region, role: p.role,
        reportsTo: p.reportsTo, baTypes: p.baTypes, status: p.status,
        eventsWorked: 0, startDate: '', profession: '', experience: ''
      }, {merge: true});
      batch.set(db.collection('members_private').doc(id), {
        phone: p.phone, email: p.email, mailingAddress: p.mailingAddress,
        workAuth: p.workAuth, instagram: p.instagram,
        bibBallInventory: p.bibBallInventory, agreementSigned: p.agreementSigned
      }, {merge: true});
    });
    batch.commit().then(function(){
      UI.importing = false; UI.importOpen = false; UI.importRows = null; render();
    }).catch(function(err){
      UI.importing = false;
      UI.importError = (err && err.code === 'permission-denied') ? 'You do not have permission to import — sign in with your @plei.com account.' : 'Import failed — please try again.';
      render();
    });
  }

  function csvEscape(v){
    var s = String(v == null ? '' : v);
    if(/[",\n]/.test(s)){ s = '"' + s.replace(/"/g, '""') + '"'; }
    return s;
  }
  function exportCSV(){
    var members = filteredMembers();
    var cols = ['Name','City','Region','Position','Reports To','Type of BA','Status','Events Worked'];
    if(IS_PLEI_USER){ cols = cols.concat(['Phone','Email','Instagram/TikTok','Work Authorization','Mailing Address','Bib/Ball Inventory','Agreement Signed']); }
    var lines = [cols.map(csvEscape).join(',')];
    members.forEach(function(m){
      var region = STATE.regions[m.region] || {name:m.region};
      var row = [m.name, m.city||'', region.name||m.region, ROLE_LABELS[m.role]||m.role, m.reportsTo||'', (m.baTypes||[]).join('; '), m.status==='inactive'?'Inactive':'Active', m.eventsWorked||0];
      if(IS_PLEI_USER){
        var priv = STATE.membersPrivate[m.id] || {};
        row = row.concat([priv.phone||'', priv.email||'', priv.instagram||'', priv.workAuth||'', priv.mailingAddress||'', priv.bibBallInventory||'', priv.agreementSigned===true?'Yes':(priv.agreementSigned===false?'No':'')]);
      }
      lines.push(row.map(csvEscape).join(','));
    });
    var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'plei-ambassadors-' + (new Date().toISOString().slice(0,10)) + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function computeStats(){
    var active = STATE.members.filter(function(m){ return m.status !== 'inactive'; });
    var totalEvents = active.reduce(function(s,m){ return s + (m.eventsWorked||0); }, 0);
    var agreementCount = 0, agreementKnown = 0;
    if(IS_PLEI_USER){
      active.forEach(function(m){
        var priv = STATE.membersPrivate[m.id];
        if(priv && typeof priv.agreementSigned === 'boolean'){ agreementKnown++; if(priv.agreementSigned) agreementCount++; }
      });
    }
    return {
      active: active.length, cities: cityCount(), totalEvents: totalEvents,
      agreementPct: agreementKnown ? Math.round(100*agreementCount/agreementKnown) : null
    };
  }

  function filteredMembers(){
    return STATE.members.filter(function(m){
      if(!FILTERS.showInactive && m.status === 'inactive') return false;
      if(FILTERS.role !== 'all' && m.role !== FILTERS.role) return false;
      if(FILTERS.region !== 'all' && m.region !== FILTERS.region) return false;
      if(FILTERS.baType !== 'all' && (m.baTypes||[]).indexOf(FILTERS.baType) === -1) return false;
      if(FILTERS.minEvents > 0 && (m.eventsWorked||0) < FILTERS.minEvents) return false;
      if(FILTERS.q){
        var q = FILTERS.q.toLowerCase();
        var hay = (m.name + ' ' + (m.city||'')).toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function cityCount(){

      if(kv.length){
        contactBody = '<div class="section-label">Contact &amp; Admin</div>' +
          kv.map(function(pair){ return '<div class="kv-row"><span class="k">' + pair[0] + '</span><span class="v">' + escapeHtml(pair[1]) + '</span></div>'; }).join('');
      }
    }
    var weekBody;
    if(IS_PLEI_USER){
      var rows = DAYS.map(function(d){
        var val = (STATE.schedule.assignments[m.id] && STATE.schedule.assignments[m.id][d]) || '';
        return '<div class="week-row"><span class="week-day">' + d + '</span>' +
          (val ? '<span class="week-value">' + escapeHtml(val) + '</span><span class="week-status on">Scheduled</span>' : '<span class="week-status off">Off</span>') +
        '</div>';
      }).join('');
      weekBody = '<div class="week-list">' + rows + '</div>';
    } else {
      weekBody = '<div class="internal-note">Sign in with your @plei.com account to see this week\'s schedule.</div>';
    }
    var about = m.experience ? '<div class="section-label">About</div><div class="about-text">' + escapeHtml(m.experience) + '</div>' : '';
    var actions = IS_PLEI_USER ?
      '<div class="modal-actions">' +
        '<button class="btn secondary" data-action="edit-member" data-value="' + m.id + '">Edit</button>' +
        '<button class="btn danger" data-action="delete-member" data-value="' + m.id + '">Remove</button>' +
      '</div>' : '';
    return '' +
      '<div class="overlay" data-action="close-modal">' +
        '<div class="modal" onclick="event.stopPropagation()">' +
          '<div class="modal-body">' +
            '<div class="modal-header">' +
              '<div class="modal-avatar">' + escapeHtml(initials(m.name)) + '</div>' +
              '<div class="modal-heading"><h2>' + escapeHtml(m.name) + '</h2>' +
              '<div class="sub">' + escapeHtml(m.city ? m.city + ' · ' : '') + escapeHtml(region.name||'') + ' Region</div></div>' +
              '<button class="icon-btn" data-action="close-modal" title="Close">✕</button>' +
            '</div>' +
            '<div class="tag-row">' + tags + '</div>' +
            '<div class="stat-row">' +
              '<div class="stat-tile"><div class="stat-num tabular">' + (m.eventsWorked||0) + '</div><div class="stat-label">Events worked</div></div>' +
              '<div class="stat-tile"><div class="stat-num">' + escapeHtml(region.name||'—') + '</div><div class="stat-label">Region</div></div>' +
              '<div class="stat-tile"><div class="stat-num">' + escapeHtml(m.startDate || '—') + '</div><div class="stat-label">On team since</div></div>' +
            '</div>' +
            '<div class="section-label">This Week</div>' +
            weekBody +
            contactBody +
            about +
            actions +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function renderMemberForm(){
    if(!UI.adding && !UI.editingId) return '';
    var editing = UI.editingId ? STATE.members.filter(function(x){ return x.id === UI.editingId; })[0] : null;
    var m = editing || {name:'',region:'central',role:'ba',city:'',startDate:'',experience:'',profession:'',eventsWorked:0,reportsTo:'',baTypes:[],status:'active'};
    var priv = (editing && STATE.membersPrivate[editing.id]) || {};
    var regionOpts = REGION_ORDER.map(function(r){ return '<option value="' + r + '"' + (m.region===r?' selected':'') + '>' + ((STATE.regions[r]&&STATE.regions[r].name)||r) + '</option>'; }).join('');
    var roleOpts = ['ba','captain','supervisor','pm'].map(function(r){ return '<option value="' + r + '"' + (m.role===r?' selected':'') + '>' + ROLE_LABELS[r] + '</option>'; }).join('');
    return '' +
      '<div class="overlay" data-action="close-form">' +
        '<div class="modal" onclick="event.stopPropagation()">' +
          '<div class="modal-body">' +
            '<h2 style="margin-top:0;">' + (editing ? 'Edit member' : 'Add member') + '</h2>' +
            '<div class="form-grid">' +
              '<div class="form-field full"><label>Name</label><input id="f-name" type="text" value="' + escapeHtml(m.name) + '"></div>' +
              '<div class="form-field"><label>Region</label><select id="f-region">' + regionOpts + '</select></div>' +
              '<div class="form-field"><label>Position</label><select id="f-role">' + roleOpts + '</select></div>' +
              '<div class="form-field"><label>City</label><input id="f-city" type="text" value="' + escapeHtml(m.city) + '"></div>' +
              '<div class="form-field"><label>Reports to</label><input id="f-reports-to" type="text" value="' + escapeHtml(m.reportsTo||'') + '"></div>' +
              '<div class="form-field"><label>Type of BA (comma-separated)</label><input id="f-batypes" type="text" placeholder="Content Creator, Event Organizer" value="' + escapeHtml((m.baTypes||[]).join(', ')) + '"></div>' +
              '<div class="form-field"><label>Start date</label><input id="f-start" type="text" placeholder="e.g. Feb 2025" value="' + escapeHtml(m.startDate) + '"></div>' +
              '<div class="form-field"><label>Profession</label><input id="f-profession" type="text" value="' + escapeHtml(m.profession) + '"></div>' +
              '<div class="form-field"><label>Events worked</label><input id="f-events" type="number" min="0" value="' + (m.eventsWorked||0) + '"></div>' +
              '<div class="form-field"><label>Status</label><select id="f-status"><option value="active"' + (m.status!=='inactive'?' selected':'') + '>Active</option><option value="inactive"' + (m.status==='inactive'?' selected':'') + '>Inactive</option></select></div>' +
              '<div class="form-field full"><label>Experience with Plei</label><textarea id="f-experience">' + escapeHtml(m.experience) + '</textarea></div>' +
            '</div>' +
            '<div class="section-label">Contact &amp; admin (internal only)</div>' +
            '<div class="form-grid">' +
              '<div class="form-field"><label>Phone</label><input id="f-phone" type="text" value="' + escapeHtml(priv.phone||'') + '"></div>' +
              '<div class="form-field"><label>Email</label><input id="f-email" type="text" value="' + escapeHtml(priv.email||'') + '"></div>' +
              '<div class="form-field"><label>Instagram/TikTok</label><input id="f-instagram" type="text" value="' + escapeHtml(priv.instagram||'') + '"></div>' +
              '<div class="form-field"><label>Work authorization</label><input id="f-workauth" type="text" value="' + escapeHtml(priv.workAuth||'') + '"></div>' +
              '<div class="form-field full"><label>Mailing address</label><input id="f-address" type="text" value="' + escapeHtml(priv.mailingAddress||'') + '"></div>' +
              '<div class="form-field"><label>Bib/ball inventory</label><input id="f-inventory" type="text" value="' + escapeHtml(priv.bibBallInventory||'') + '"></div>' +
              '<div class="form-field"><label>Agreement signed</label><select id="f-agreement"><option value="yes"' + (priv.agreementSigned?' selected':'') + '>Yes</option><option value="no"' + (!priv.agreementSigned?' selected':'') + '>No</option></select></div>' +
            '</div>' +
            '<div class="modal-actions">' +
              '<button class="btn" data-action="save-member" data-value="' + (editing ? editing.id : '') + '">Save</button>' +
              '<button class="btn secondary" data-action="close-form">Cancel</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function renderImportForm(){
    if(!UI.importOpen) return '';
    var body;
    if(UI.importRows){
      var inactiveCount = UI.importRows.filter(function(p){ return p.status === 'inactive'; }).length;
      var summary = UI.importRows.length + ' people found' + (inactiveCount ? ' (' + inactiveCount + ' flagged inactive/removal)' : '') + '.\nContact details (phone, email, address, work auth, Instagram, inventory, agreement) are only ever visible to signed-in @plei.com accounts — the public roster only ever shows name, city, region, role and type.';
      body = '<div class="import-summary">' + escapeHtml(summary) + '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn" data-action="confirm-import"' + (UI.importing?' disabled':'') + '>' + (UI.importing ? 'Importing…' : 'Import ' + UI.importRows.length + ' people') + '</button>' +
          '<button class="btn secondary" data-action="close-import">Cancel</button>' +
        '</div>';
    } else {
      body = '<div class="import-dropzone">Choose the CSV export of your roster sheet.<br><input type="file" accept=".csv,text/csv" data-action="import-file"></div>' +
        (UI.importError ? '<div class="error-note">' + escapeHtml(UI.importError) + '</div>' : '') +
        '<div class="modal-actions"><button class="btn secondary" data-action="close-import">Cancel</button></div>';
    }
    return '' +
      '<div class="overlay" data-action="close-import">' +
        '<div class="modal" onclick="event.stopPropagation()">' +
          '<div class="modal-body">' +
            '<h2 style="margin-top:0;">Import roster</h2>' +
            '<div class="sub" style="margin-bottom:14px;">Creates or updates members by name. Re-importing the same sheet later is safe — it just updates everyone again.</div>' +
            body +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function renderRegionForm(){
    if(!UI.editingRegions) return '';
    var rows = REGION_ORDER.map(function(key){
      var region = STATE.regions[key] || {name:key, supervisor:''};
      return '<div class="form-field full"><label>' + (region.name||key) + ' supervisor</label><input data-region-input="' + key + '" type="text" value="' + escapeHtml(region.supervisor||'') + '"></div>';
    }).join('');
    return '' +
      '<div class="overlay" data-action="close-region-form">' +
        '<div class="modal" onclick="event.stopPropagation()">' +
          '<div class="modal-body">' +
            '<h2 style="margin-top:0;">Edit region leadership</h2>' +
            '<div class="form-grid">' + rows + '</div>' +
            '<div class="modal-actions">' +
              '<button class="btn" data-action="save-regions">Save</button>' +
              '<button class="btn secondary" data-action="close-region-form">Cancel</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function renderAuditLog(){
    if(!UI.auditOpen) return '';
    var actionLabel = {create:'added', update:'updated', delete:'removed', import:'ran a bulk import'};
    var rows = (STATE.auditLog||[]).map(function(e){
      var when = (e.editedAt && e.editedAt.toDate) ? e.editedAt.toDate().toLocaleString() : 'just now';
      var label = actionLabel[e.action] || e.action;
      return '<div class="log-row"><div><strong>' + escapeHtml(e.editedBy||'Someone') + '</strong> ' + label + (e.memberName ? ' <strong>' + escapeHtml(e.memberName) + '</strong>' : '') + '</div>' +
        (e.note ? '<div class="log-meta">' + escapeHtml(e.note) + '</div>' : '') +
        '<div class="log-meta">' + escapeHtml(when) + '</div></div>';
    }).join('');
    return '' +
      '<div class="overlay" data-action="close-audit">' +
        '<div class="modal" onclick="event.stopPropagation()">' +
          '<div class="modal-body">' +
            '<div class="section-head"><h2 style="font-size:17px;">Activity Log</h2><button class="icon-btn" data-action="close-audit" title="Close">✕</button></div>' +
            '<div class="sub" style="margin-bottom:14px;">Last 20 changes to the roster, most recent first — this record can\'t be edited or deleted.</div>' +
            '<div class="log-list">' + (rows || '<div class="empty-note">No activity yet.</div>') + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function render(){
    var html = '' +
      renderTopBar() +
      renderBanner() +
      renderGlance() +
      renderFilterBar() +
      renderMap() +
      renderRoster() +
      '<div class="bottom-layout">' + renderSchedule() + renderLeaderboard() + '</div>' +
      (UI.error ? '<div class="error-note">' + escapeHtml(UI.error) + '</div>' : '') +
      (UI.authError ? '<div class="error-note">' + escapeHtml(UI.authError) + '</div>' : '') +
      '<div class="footer-note">Plei Brand Ambassador Program · Phase 1 preview · Phase 2 adds games played, activity tracking, social &amp; affiliate data to every profile.</div>' +
      renderMemberModal() +
      renderMemberForm() +
      renderImportForm() +
      renderRegionForm() +
      renderAuditLog();
    document.getElementById('app').innerHTML = html;
    bindHandlers();
  }

  function bindHandlers(){
    var app = document.getElementById('app');
    app.querySelectorAll('[data-action]').forEach(function(el){
      var action = el.getAttribute('data-action');
      if(action === 'sign-in'){
        el.addEventListener('click', signIn);
      } else if(action === 'sign-out'){
        el.addEventListener('click', signOutUser);
      } else if(action === 'seed-defaults'){
        el.addEventListener('click', seedDefaults);
      } else if(action === 'filter-role'){
        el.addEventListener('click', function(){ FILTERS.role = el.getAttribute('data-value'); render(); });
      } else if(action === 'filter-region' || action === 'pick-region'){
        el.addEventListener('click', function(){ FILTERS.region = el.getAttribute('data-value'); render(); var sec = document.getElementById('roster-section'); if(sec) sec.scrollIntoView({behavior:'smooth', block:'start'}); });
      } else if(action === 'search'){
        el.addEventListener('input', function(){ FILTERS.q = el.value; render(); var input = document.querySelector('.search-input'); if(input){ input.focus(); input.setSelectionRange(input.value.length, input.value.length);} });
      } else if(action === 'open-member'){
        el.addEventListener('click', function(){ UI.selectedId = el.getAttribute('data-value'); render(); });
      } else if(action === 'close-modal'){
        el.addEventListener('click', function(){ UI.selectedId = null; render(); });
      } else if(action === 'add-member'){
        el.addEventListener('click', function(){ UI.adding = true; UI.editingId = null; UI.selectedId = null; render(); });
      } else if(action === 'edit-member'){
        el.addEventListener('click', function(){ UI.editingId = el.getAttribute('data-value'); UI.adding = false; UI.selectedId = null; render(); });
      } else if(action === 'delete-member'){
        el.addEventListener('click', function(){
          var id = el.getAttribute('data-value');
          var m = STATE.members.filter(function(x){ return x.id === id; })[0];
          logAudit('delete', id, m ? m.name : id, 'removed from roster');
          UI.selectedId = null; render();
          deleteMember(id);
        });
      } else if(action === 'close-form'){
        el.addEventListener('click', function(){ UI.adding = false; UI.editingId = null; render(); });
      } else if(action === 'save-member'){
        el.addEventListener('click', function(){
          var id = el.getAttribute('data-value');
          var data = {
            name: document.getElementById('f-name').value.trim() || 'Unnamed',
            region: document.getElementById('f-region').value,
            role: document.getElementById('f-role').value,
            city: document.getElementById('f-city').value.trim(),
            reportsTo: document.getElementById('f-reports-to').value.trim(),
            baTypes: document.getElementById('f-batypes').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean),
            startDate: document.getElementById('f-start').value.trim(),
            profession: document.getElementById('f-profession').value.trim(),
            eventsWorked: parseInt(document.getElementById('f-events').value, 10) || 0,
            status: document.getElementById('f-status').value,
            experience: document.getElementById('f-experience').value.trim()
          };
          var privateData = {
            phone: document.getElementById('f-phone').value.trim(),
            email: document.getElementById('f-email').value.trim(),
            instagram: document.getElementById('f-instagram').value.trim(),
            workAuth: document.getElementById('f-workauth').value.trim(),
            mailingAddress: document.getElementById('f-address').value.trim(),
            bibBallInventory: document.getElementById('f-inventory').value.trim(),
            agreementSigned: document.getElementById('f-agreement').value === 'yes'
          };
          var prevPublic = id ? STATE.members.filter(function(x){ return x.id === id; })[0] : null;
          var prevPrivate = id ? (STATE.membersPrivate[id] || {}) : {};
          var changed = [];
          if(prevPublic){
            Object.keys(data).forEach(function(k){ if(JSON.stringify(prevPublic[k]) !== JSON.stringify(data[k])) changed.push(k); });
            Object.keys(privateData).forEach(function(k){ if(JSON.stringify(prevPrivate[k]) !== JSON.stringify(privateData[k])) changed.push(k); });
          }
          logAudit(id ? 'update' : 'create', id, data.name, id ? ('changed: ' + (changed.join(', ') || '—')) : 'new member added');
          UI.adding = false; UI.editingId = null; render();
          saveMember(id || null, data, privateData);
        });
      } else if(action === 'filter-type'){
        el.addEventListener('click', function(){ FILTERS.baType = el.getAttribute('data-value'); render(); });
      } else if(action === 'filter-min-events'){
        el.addEventListener('change', function(){ FILTERS.minEvents = parseInt(el.value, 10) || 0; render(); });
      } else if(action === 'toggle-inactive'){
        el.addEventListener('change', function(){ FILTERS.showInactive = el.checked; render(); });
      } else if(action === 'open-import'){
        el.addEventListener('click', function(){ UI.importOpen = true; UI.importRows = null; UI.importError = ''; render(); });
      } else if(action === 'close-import'){
        el.addEventListener('click', function(){ UI.importOpen = false; UI.importRows = null; UI.importError = ''; render(); });
      } else if(action === 'import-file'){
        el.addEventListener('change', function(){
          var file = el.files && el.files[0];
          if(!file) return;
          var reader = new FileReader();
          reader.onload = function(e){
            var parsed = parseRosterCSV(String(e.target.result||''));
            if(parsed.error){ UI.importError = parsed.error; UI.importRows = null; }
            else { UI.importRows = parsed.people; UI.importError = ''; }
            render();
          };
          reader.onerror = function(){ UI.importError = 'Could not read that file.'; render(); };
          reader.readAsText(file);
        });
      } else if(action === 'confirm-import'){
        el.addEventListener('click', function(){
          if(!UI.importRows) return;
          var inactiveN = UI.importRows.filter(function(p){ return p.status === 'inactive'; }).length;
          logAudit('import', '', '', 'bulk import: ' + UI.importRows.length + ' people (' + inactiveN + ' inactive)');
          importRoster(UI.importRows);
        });
      } else if(action === 'export-csv'){
        el.addEventListener('click', exportCSV);
      } else if(action === 'clear-filters'){
        el.addEventListener('click', function(){ FILTERS.role='all'; FILTERS.region='all'; FILTERS.baType='all'; FILTERS.minEvents=0; FILTERS.q=''; render(); });
      } else if(action === 'open-audit'){
        el.addEventListener('click', function(){ UI.auditOpen = true; render(); });
      } else if(action === 'close-audit'){
        el.addEventListener('click', function(){ UI.auditOpen = false; render(); });
      } else if(action === 'edit-region'){
        el.addEventListener('click', function(){ UI.editingRegions = true; render(); });
      } else if(action === 'close-region-form'){
        el.addEventListener('click', function(){ UI.editingRegions = false; render(); });
      } else if(action === 'save-regions'){
        el.addEventListener('click', function(){
          var inputs = document.querySelectorAll('[data-region-input]');
          var updates = {};
          inputs.forEach(function(inp){ updates[inp.getAttribute('data-region-input')] = inp.value.trim(); });
          UI.editingRegions = false; render();
          saveRegions(updates);
        });
      } else if(action === 'save-schedule'){
        el.addEventListener('click', function(){
          var inputs = document.querySelectorAll('[data-action="sched-input"]');
          var assignments = JSON.parse(JSON.stringify(STATE.schedule.assignments));
          inputs.forEach(function(inp){
            var member = inp.getAttribute('data-member'), day = inp.getAttribute('data-day');
            assignments[member] = assignments[member] || {};
            assignments[member][day] = inp.value.trim();
          });
          saveSchedule(assignments);
        });
      }
    });
  }

  render();
})();
</script>
</body>
</html>
